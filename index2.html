    tailwind.config = {
      darkMode: 'class',

        extend: {
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', 'SF Pro Display', 'SF Pro Text', 'Inter', 'system-ui', 'sans-serif'],

          colors: {
            ios: {
              bg: '#000000',
              card: '#1C1C1E',
              elevated: '#2C2C2E',
              tertiary: '#3A3A3C',
              blue: '#0A84FF',
              green: '#30D158',
              amber: '#FF9F0A',
              red: '#FF453A',
              purple: '#BF5AF2',

  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      background-color: #000000;
      color: #F5F5F7;
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      letter-spacing: -0.012em;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    .apple-glass {
      background: rgba(28, 28, 30, 0.72);
      backdrop-filter: saturate(180%) blur(24px);
      -webkit-backdrop-filter: saturate(180%) blur(24px);
    }
    .apple-nav-glass {
      background: rgba(12, 12, 14, 0.78);
      backdrop-filter: saturate(190%) blur(28px);
      -webkit-backdrop-filter: saturate(190%) blur(28px);
    }
    .apple-card {
      background: rgba(28, 28, 30, 0.86);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.09);
      box-shadow: 0 12px 32px -8px rgba(0, 0, 0, 0.65);
    }
    .live-activity-glow {
      background: linear-gradient(135deg, rgba(28, 28, 32, 0.95) 0%, rgba(18, 28, 45, 0.92) 55%, rgba(16, 36, 32, 0.92) 100%);
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 18px 40px -12px rgba(10, 132, 255, 0.22);
    }
    .boarding-perforation {
      background-image: radial-gradient(circle at 0 50%, #000000 10px, transparent 11px),
                        radial-gradient(circle at 100% 50%, #000000 10px, transparent 11px);
    }
    @keyframes springIn {
      from { opacity: 0; transform: translateY(8px) scale(0.99); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .animate-apple { animation: springIn 0.28s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
  </style>
</head>

      <div class="hidden sm:flex items-center gap-2">

          <span>Backup & Dados</span>
        </button>

        <button onclick="app.openNewTripModal('parser')" class="inline-flex items-center gap-1.5 px-4 py-2 rounded-full text-xs font-semibold bg-white hover:bg-zinc-100 text-black shadow-sm transition">
          <i data-lucide="plus" class="w-4 h-4 stroke-[2.5]"></i>
          <span>Nova Viagem</span>
        </button>
      </div>

      <!-- Mobile Quick Status / Backup Trigger -->
      <div class="flex sm:hidden items-center gap-2">
        <button onclick="app.openNewTripModal('ai')" class="inline-flex items-center gap-1 px-3 py-1.5 rounded-full text-[11px] font-medium bg-white/10 text-[#64D2FF] border border-white/10">

          <span>IA JSON</span>
        </button>
      </div>
    </div>

  <input type="file" id="importJsonInput" accept=".json,application/json" class="hidden" onchange="app.importBackup(event)" />

    // =========================================================================
    // 3 ROTEIROS INICIAIS PRÉ-CARREGADOS (INTACTOS + ENRIQUECIDOS PARA V2.0)
    // =========================================================================
    const INITIAL_TRIPS = [    ];

    // =========================================================================
    // MOTOR PRINCIPAL — ATLAS CONCIERGE 2.0 (COMPATIBILIDADE TOTAL COM V1)
    // =========================================================================
    const STORAGE_KEY = 'atlas_concierge_travel_hub_v1';

    const PT_MONTHS = {
      jan: '01', fev: '02', mar: '03', abr: '04', mai: '05', jun: '06',
      jul: '07', ago: '08', set: '09', out: '10', nov: '11', dez: '12'
    };
    const MONTH_NAMES_FULL = [
      'Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho',
      'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'
    ];
    const MONTH_SHORT_PT = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];

    const app = {
      state: {
        trips: [],
        view: 'home',           // 'home' | 'trip'
        homeDisplay: 'list',    // 'list' | 'calendar'
        calendarYear: 2025,
        calendarMonth: 1,       // 0-indexed (1 = Fevereiro 2025 por padrão se houver viagem lá)
        selectedTripId: null,
        activeTab: 'itinerary', // 'itinerary' | 'logistics' | 'gastronomy' | 'budget' | 'checklist'
        selectedDayIndex: 0,
        expandedActivities: {},
        openCardMenuId: null,
        filters: {
          status: 'Todas',
          country: 'Todos',
          year: 'Todos',
          search: ''
        },
        gastronomySearch: '',
        converterAmount: 10000,
        converterFrom: 'HUF',
        modalCoverTemp: '',
        wikiDebounceTimer: null
      },

      init() {
        this.loadState();
        this.syncInitialCalendarMonth();
        this.render();

        document.addEventListener('click', (e) => {
          if (this.state.openCardMenuId && !e.target.closest('[data-card-menu]')) {
            this.state.openCardMenuId = null;
            this.render();
          }
        });
      },

      normalizeText(str) {
        return (str || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
      },

      inferCurrencyFromCountry(country, city) {
        const c = this.normalizeText(`${country} ${city}`);
        if (c.includes('hungria') || c.includes('budapeste') || c.includes('hungary')) return 'HUF';
        if (c.includes('tcheca') || c.includes('praga') || c.includes('czech')) return 'CZK';
        if (c.includes('reino unido') || c.includes('inglaterra') || c.includes('escocia') || c.includes('londres') || c.includes('edimburgo')) return 'GBP';
        if (c.includes('suica') || c.includes('zurique') || c.includes('zermatt') || c.includes('genebra')) return 'CHF';
        if (c.includes('estados unidos') || c.includes('eua') || c.includes('nova york') || c.includes('new york')) return 'USD';
        if (c.includes('japao') || c.includes('toquio') || c.includes('quioto') || c.includes('tokyo')) return 'JPY';
        if (c.includes('brasil') || c.includes('rio de janeiro') || c.includes('sao paulo')) return 'BRL';
        return 'EUR';
      },

      inferTransportMode(transportType) {
        const t = this.normalizeText(transportType);
        if (t.includes('trem') || t.includes('rail') || t.includes('db') || t.includes('deutschlandticket') || t.includes('eurocity') || t.includes('ice') || t.includes('tgv')) return 'train';
        if (t.includes('onibus') || t.includes('flixbus') || t.includes('bus')) return 'bus';
        if (t.includes('carro') || t.includes('aluguel') || t.includes('roadtrip') || t.includes('auto')) return 'car';
        return 'plane';
      },

      inferDatesFromText(datesStr, fallbackYear = '2025') {
        if (!datesStr) return { startDate: '', endDate: '' };
        // Ex: "14 Fev – 17 Fev 2025" ou "08 Nov – 10 Nov 2024"
        const yearMatch = datesStr.match(/(20\d{2})/);
        const yr = yearMatch ? yearMatch[1] : String(fallbackYear || new Date().getFullYear());
        const regex = /(\d{1,2})\s*([A-Za-zçÇ]{3})/g;
        const matches = [...datesStr.matchAll(regex)];
        if (matches.length >= 1) {
          const d1 = matches[0][1].padStart(2, '0');
          const m1 = PT_MONTHS[this.normalizeText(matches[0][2]).slice(0, 3)] || '01';
          const startDate = `${yr}-${m1}-${d1}`;
          let endDate = startDate;
          if (matches.length >= 2) {
            const d2 = matches[1][1].padStart(2, '0');
            const m2 = PT_MONTHS[this.normalizeText(matches[1][2]).slice(0, 3)] || m1;
            endDate = `${yr}-${m2}-${d2}`;
          }
          return { startDate, endDate };
        }
        return { startDate: '', endDate: '' };
      },

      formatDisplayDatesFromISO(startDate, endDate) {
        if (!startDate) return 'Datas a definir';
        const p1 = startDate.split('-');
        if (p1.length !== 3) return startDate;
        const y1 = p1[0];
        const m1 = MONTH_SHORT_PT[parseInt(p1[1], 10) - 1] || p1[1];
        const d1 = p1[2];
        if (!endDate || endDate === startDate) return `${d1} ${m1} ${y1}`;
        const p2 = endDate.split('-');
        if (p2.length !== 3) return `${d1} ${m1} ${y1}`;
        const y2 = p2[0];
        const m2 = MONTH_SHORT_PT[parseInt(p2[1], 10) - 1] || p2[1];
        const d2 = p2[2];
        return `${d1} ${m1} – ${d2} ${m2} ${y2}`;
      },

      migrateTripToV2(trip, idx = 0) {
        const migrated = { ...trip };
        if (!migrated.logistics) migrated.logistics = {};
        if (!migrated.logistics.mode) {
          migrated.logistics.mode = this.inferTransportMode(migrated.logistics.transportType || '');
        }
        if (!migrated.localCurrency) {
          migrated.localCurrency = this.inferCurrencyFromCountry(migrated.country, migrated.city);
        }
        if (!migrated.startDate || !migrated.endDate) {
          const inferred = this.inferDatesFromText(migrated.dates, migrated.year);
          if (inferred.startDate) {
            migrated.startDate = inferred.startDate;
            migrated.endDate = inferred.endDate || inferred.startDate;
          }
        }
        if (!Array.isArray(migrated.prepChecklist) || migrated.prepChecklist.length === 0) {
          const initialMatch = INITIAL_TRIPS.find(t => t.id === migrated.id);
          migrated.prepChecklist = initialMatch && initialMatch.prepChecklist
            ? JSON.parse(JSON.stringify(initialMatch.prepChecklist))
            : JSON.parse(JSON.stringify(DEFAULT_PREP_CHECKLIST));
        }
        if (!migrated.fallbackGradient || migrated.fallbackGradient.includes('zinc-950')) {
          migrated.fallbackGradient = APPLE_GRADIENTS[idx % APPLE_GRADIENTS.length];
        }
        if (!Array.isArray(migrated.expenses)) migrated.expenses = [];
        if (!Array.isArray(migrated.gastronomy)) migrated.gastronomy = [];
        if (!Array.isArray(migrated.days)) migrated.days = [];
        if (!migrated.contingency) {
          migrated.contingency = {
            planB: 'Museus cobertos, mercados gastronômicos históricos e cafés tradicionais.',
            souvenirs: 'Artesanato autêntico e produtos gastronômicos locais.'
          };
        }
        return migrated;
      },

      loadState() {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed) && parsed.length > 0) {
              this.state.trips = parsed.map((t, i) => this.migrateTripToV2(t, i));
              this.saveState();
              return;
            }
          }
        } catch (err) {
          console.error('Erro ao ler localStorage:', err);
        }
        this.state.trips = JSON.parse(JSON.stringify(INITIAL_TRIPS)).map((t, i) => this.migrateTripToV2(t, i));
        this.saveState();
      },

      saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(this.state.trips));
        } catch (err) {
          console.error('Erro ao salvar localStorage:', err);
          this.toast('Limite de armazenamento atingido. Exporte um backup JSON.', 'error');
        }
      },

      syncInitialCalendarMonth() {
        const upcoming = this.state.trips.find(t => t.status === 'Próximas' && t.startDate) || this.state.trips.find(t => t.startDate);
        if (upcoming && upcoming.startDate) {
          const [y, m] = upcoming.startDate.split('-').map(Number);
          if (y && m) {
            this.state.calendarYear = y;
            this.state.calendarMonth = m - 1;
            return;
          }
        }
        const now = new Date();
        this.state.calendarYear = now.getFullYear();
        this.state.calendarMonth = now.getMonth();
      },

      // =========================================================================
      // SISTEMA AUTOMÁTICO DE CAPAS (WIKIPEDIA API + FALLBACK 30+ CIDADES + UPLOAD)
      // =========================================================================
      getDictionaryCover(city, country) {
        const cleanCity = this.normalizeText(city).split(/&|,|\//)[0].trim();
        const cleanCountry = this.normalizeText(country);
        if (CITY_IMAGE_DICTIONARY[cleanCity]) return CITY_IMAGE_DICTIONARY[cleanCity];
        for (const [key, url] of Object.entries(CITY_IMAGE_DICTIONARY)) {
          if (cleanCity.includes(key) || cleanCountry.includes(key)) return url;
        }
        return '';
      },

      async resolveSmartCover(city, country) {
        const primaryCity = (city || '').split(/&|,|\//)[0].trim();
        if (!primaryCity) return '';

        // 1. Consulta em tempo real Wikipedia REST API (PT -> EN)
        const endpoints = [
          `https://pt.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(primaryCity)}`,
          `https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(primaryCity)}`
        ];

        for (const url of endpoints) {
          try {
            const ctrl = new AbortController();
            const timer = setTimeout(() => ctrl.abort(), 3200);
            const res = await fetch(url, { signal: ctrl.signal });
            clearTimeout(timer);
            if (res.ok) {
              const data = await res.json();
              const img = (data.originalimage && data.originalimage.source) || (data.thumbnail && data.thumbnail.source);
              if (img && !img.endsWith('.svg') && !img.includes('Flag_of')) {
                return img;
              }
            }
          } catch (_) {
            // Ignora falha de rede/offline e segue para o fallback
          }
        }

        // 2. Fallback interno com 30+ destinos icônicos
        return this.getDictionaryCover(city, country);
      },

      triggerLiveCoverLookup(cityInputId, countryInputId, statusElId, previewElId) {
        clearTimeout(this.state.wikiDebounceTimer);
        const cityEl = document.getElementById(cityInputId);
        const countryEl = document.getElementById(countryInputId);
        const statusEl = document.getElementById(statusElId);
        const previewEl = document.getElementById(previewElId);
        if (!cityEl) return;

        const city = cityEl.value.trim();
        const country = countryEl ? countryEl.value.trim() : '';
        if (city.length < 3) return;

        // Se o usuário escolheu foto local (data:image), não sobrescreve automaticamente
        if (this.state.modalCoverTemp && this.state.modalCoverTemp.startsWith('data:image')) return;

        if (statusEl) statusEl.textContent = 'Buscando foto oficial do destino...';
        this.state.wikiDebounceTimer = setTimeout(async () => {
          const url = await this.resolveSmartCover(city, country);
          if (url) {
            this.state.modalCoverTemp = url;
            if (previewEl) {
              previewEl.src = url;
              previewEl.classList.remove('hidden');
            }
            if (statusEl) statusEl.textContent = 'Capa encontrada automaticamente via Wikimedia / Curadoria Atlas';
          } else {
            this.state.modalCoverTemp = '';
            if (previewEl) previewEl.classList.add('hidden');
            if (statusEl) statusEl.textContent = 'Sem foto externa • Gradiente Apple Editorial ativo (ou envie do dispositivo)';
          }
        }, 480);
      },

      handleDeviceImageUpload(event, previewElId, statusElId) {
        const file = event.target.files && event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            // Redimensiona para ~1280px max para preservar performance do localStorage
            const maxW = 1280;
            let w = img.width;
            let h = img.height;
            if (w > maxW) {
              h = Math.round((h * maxW) / w);
              w = maxW;
            }
            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            const dataUrl = canvas.toDataURL('image/jpeg', 0.82);
            this.state.modalCoverTemp = dataUrl;
            const previewEl = document.getElementById(previewElId);
            const statusEl = document.getElementById(statusElId);
            if (previewEl) {
              previewEl.src = dataUrl;
              previewEl.classList.remove('hidden');
            }
            if (statusEl) statusEl.textContent = 'Foto do seu dispositivo pronta para salvar!';
            this.toast('Foto carregada do dispositivo!');
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      },

      // =========================================================================
      // HELPERS VISUAIS E FINANCEIROS
      // =========================================================================
      escape(str) {
        if (str === null || str === undefined) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      },

      formatEUR(val) {
        const num = Number(val) || 0;
        return num.toLocaleString('pt-BR', { style: 'currency', currency: 'EUR' });
      },

      formatBRL(val) {
        const num = Number(val) || 0;
        return num.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
      },

      formatOriginalCurrency(amount, currency) {
        const num = Number(amount) || 0;
        if (currency === 'HUF' || currency === 'JPY' || currency === 'CZK') {
          return `${Math.round(num).toLocaleString('pt-BR')} ${currency}`;
        }
        try {
          return num.toLocaleString('pt-BR', { style: 'currency', currency: currency || 'EUR' });
        } catch {
          return `${num.toFixed(2)} ${currency}`;
        }
      },

      toEUR(amount, currency) {
        const rate = EXCHANGE_RATES_TO_EUR[currency] || 1;
        return (Number(amount) || 0) * rate;
      },

      toBRL(amount, currency) {
        const eur = this.toEUR(amount, currency);
        return eur / EXCHANGE_RATES_TO_EUR.BRL;
      },

      getTripEstimatedTotal(trip) {
        const b = trip.budgetEstimated || { transport: 0, attractions: 0, food: 0 };
        return (Number(b.transport) || 0) + (Number(b.attractions) || 0) + (Number(b.food) || 0);
      },

      getTripRealTotalEUR(trip) {
        return (trip.expenses || []).reduce((acc, exp) => acc + this.toEUR(exp.amount, exp.currency), 0);
      },

      getTripProgress(trip) {
        let total = 0;
        let done = 0;
        (trip.days || []).forEach(d => {
          (d.activities || []).forEach(a => {
            total += 1;
            if (a.done) done += 1;
          });
        });
        const pct = total === 0 ? 0 : Math.round((done / total) * 100);
        return { total, done, pct };
      },

      getNextPendingStep(trip) {
        const days = trip.days || [];
        if (days.length === 0) return null;
        // Prioriza o dia selecionado atualmente; se tudo concluído nele, busca no restante da viagem
        const curIdx = Math.min(this.state.selectedDayIndex, Math.max(0, days.length - 1));
        const curDay = days[curIdx];
        if (curDay && curDay.activities) {
          const pendingInCur = curDay.activities.find(a => !a.done);
          if (pendingInCur) return { day: curDay, dayIdx: curIdx, activity: pendingInCur };
        }
        for (let i = 0; i < days.length; i++) {
          const pending = (days[i].activities || []).find(a => !a.done);
          if (pending) return { day: days[i], dayIdx: i, activity: pending };
        }
        return null;
      },

      getMapsUrl(query) {
        return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(query || '');
      },

      toast(msg, type = 'success') {
        const container = document.getElementById('toastContainer');
        const el = document.createElement('div');
        const dotColor = type === 'error' ? 'bg-[#FF453A]' : 'bg-[#30D158]';
        el.className = `pointer-events-auto flex items-center gap-2.5 px-4 py-2.5 rounded-full bg-[#1C1C1E]/95 backdrop-blur-2xl border border-white/15 shadow-2xl text-xs font-medium text-white animate-apple`;
        el.innerHTML = `
          <span class="w-2 h-2 rounded-full ${dotColor} shrink-0"></span>
          <span>${this.escape(msg)}</span>
        `;
        container.appendChild(el);
        setTimeout(() => {
          el.style.opacity = '0';
          el.style.transform = 'translateY(-6px)';
          el.style.transition = 'all 0.25s ease';
          setTimeout(() => el.remove(), 260);
        }, 2600);
      },

      updateMobileTabBarHighlight() {
        const btnExp = document.getElementById('tabBtnExplore');
        const btnCal = document.getElementById('tabBtnCalendar');
        if (!btnExp || !btnCal) return;
        const isCal = this.state.view === 'home' && this.state.homeDisplay === 'calendar';
        const isExp = this.state.view === 'trip' || (this.state.view === 'home' && this.state.homeDisplay === 'list');
        btnExp.className = `flex flex-col items-center justify-center gap-1 text-[10px] font-medium transition ${isExp ? 'text-[#0A84FF]' : 'text-zinc-400'}`;
        btnCal.className = `flex flex-col items-center justify-center gap-1 text-[10px] font-medium transition ${isCal ? 'text-[#0A84FF]' : 'text-zinc-400'}`;
      },

      // =========================================================================
      goHome(displayMode = null) {
        this.state.view = 'home';
        if (displayMode) this.state.homeDisplay = displayMode;
        this.state.selectedTripId = null;
        window.scrollTo({ top: 0, behavior: 'smooth' });

      setHomeDisplay(mode) {

      shiftCalendarMonth(delta) {
        let m = this.state.calendarMonth + delta;
        let y = this.state.calendarYear;
        if (m < 0) { m = 11; y -= 1; }
        if (m > 11) { m = 0; y += 1; }
        this.state.calendarMonth = m;
        this.state.calendarYear = y;
        this.render();
      },

      jumpToCalendarMonth(year, monthZeroIndexed) {
        this.state.calendarYear = year;
        this.state.calendarMonth = monthZeroIndexed;
        this.render();
      },

      openTrip(tripId) {
        const trip = this.state.trips.find(t => t.id === tripId);
        if (!trip) return;
        this.state.selectedTripId = tripId;
        this.state.view = 'trip';
        this.state.activeTab = 'itinerary';
        this.state.selectedDayIndex = 0;
        this.state.gastronomySearch = '';
        this.state.converterFrom = trip.localCurrency && trip.localCurrency !== 'EUR' ? trip.localCurrency : 'HUF';
        this.state.converterAmount = this.state.converterFrom === 'HUF' ? 10000 : 50;
        window.scrollTo({ top: 0, behavior: 'smooth' });
        this.render();
      },

      getSelectedTrip() {
        return this.state.trips.find(t => t.id === this.state.selectedTripId) || null;
      },

      setTab(tab) {
        this.state.activeTab = tab;
        this.render();
      },

      setDayIndex(idx) {
        this.state.selectedDayIndex = idx;
        this.render();
      },

      setFilter(key, val) {
        this.state.filters[key] = val;

      toggleCardMenu(tripId, ev) {
        if (ev) ev.stopPropagation();
        this.state.openCardMenuId = this.state.openCardMenuId === tripId ? null : tripId;
        this.render();
      },

      resetDemoData() {
        if (!confirm('Restaurar os 3 roteiros originais (Budapeste, Barcelona e Colônia/Dortmund)? Faça um Exportar JSON antes caso queira guardar alterações pessoais.')) return;
        this.state.trips = JSON.parse(JSON.stringify(INITIAL_TRIPS)).map((t, i) => this.migrateTripToV2(t, i));
        this.saveState();
        this.goHome('list');
        this.toast('Roteiros originais restaurados!');
      },

      exportBackup() {
        const payload = {
          app: 'Atlas Concierge — Travel Hub',
          edition: '2.0 Apple Design Edition',
          exportedAt: new Date().toISOString(),
          version: 2,
          trips: this.state.trips
        };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `atlas-concierge-v2-backup-${new Date().toISOString().slice(0, 10)}.json`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
        this.toast('Backup JSON exportado!');
      },

      importBackup(event) {
        const file = event.target.files && event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const parsed = JSON.parse(e.target.result);
            const importedTrips = Array.isArray(parsed) ? parsed : (Array.isArray(parsed.trips) ? parsed.trips : null);
            if (!importedTrips) throw new Error('Formato inválido');
            this.state.trips = importedTrips.map((t, i) => this.migrateTripToV2(t, i));
            this.saveState();
            this.syncInitialCalendarMonth();
            this.goHome('list');
            this.toast(`${importedTrips.length} viagem(ns) sincronizada(s) com sucesso!`);
          } catch (err) {
            this.toast('Arquivo JSON inválido.', 'error');
          } finally {
            event.target.value = '';
          }
        };
        reader.readAsText(file);
      },

      copyText(text, label = 'Texto', btnEl = null) {
        if (!text) return;
        const done = () => {
          if (btnEl) {
            const orig = btnEl.innerHTML;
            btnEl.innerHTML = `<i data-lucide="check" class="w-3.5 h-3.5 text-[#30D158]"></i><span>Copiado!</span>`;
            lucide.createIcons();
            setTimeout(() => {
              btnEl.innerHTML = orig;
              lucide.createIcons();
            }, 1800);
          }
          this.toast(`${label} copiado para a área de transferência!`);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(done).catch(() => {
            this.fallbackCopy(text);
            done();
          });
        } else {
          this.fallbackCopy(text);
          done();
        }
      },

      fallbackCopy(text) {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        ta.remove();
      },

      // =========================================================================
      // CONVERSOR DE CÂMBIO INSTANTÂNEO (SEM RE-RENDER PESADO)
      // =========================================================================
      updateQuickConverter(amountVal, fromCurr) {
        if (amountVal !== null && amountVal !== undefined) {
          this.state.converterAmount = parseFloat(amountVal) || 0;
        }
        if (fromCurr) {
          this.state.converterFrom = fromCurr;
        }
        const amt = this.state.converterAmount;
        const from = this.state.converterFrom;
        const eurText = this.formatEUR(this.toEUR(amt, from));
        const brlText = this.formatBRL(this.toBRL(amt, from));
        document.querySelectorAll('.js-conv-eur').forEach(el => { el.textContent = eurText; });
        document.querySelectorAll('.js-conv-brl').forEach(el => { el.textContent = brlText; });
      },

      // =========================================================================
      // AÇÕES DE VIAGEM, DIAS, ATIVIDADES, CHECKLIST & DESPESAS
      // =========================================================================
      toggleActivityExpand(actId) {
        this.state.expandedActivities[actId] = !this.state.expandedActivities[actId];
        this.render();
      },

      toggleActivityDone(tripId, dayIndex, actId, ev) {
        if (ev) ev.stopPropagation();
        const trip = this.state.trips.find(t => t.id === tripId);
        if (!trip || !trip.days[dayIndex]) return;
        const act = trip.days[dayIndex].activities.find(a => a.id === actId);
        if (!act) return;
        act.done = !act.done;
        this.saveState();
        this.render();
        this.toast(act.done ? ' Etapa concluída!' : 'Etapa reaberta.');
      },

      changeTripStatus(tripId, newStatus) {
        const trip = this.state.trips.find(t => t.id === tripId);
        if (!trip) return;
        trip.status = newStatus;
        this.saveState();
        this.render();
        this.toast(`Status alterado para "${newStatus}"`);
      },

      deleteTrip(tripId, ev) {
        if (ev) ev.stopPropagation();
        const trip = this.state.trips.find(t => t.id === tripId);
        if (!trip) return;
        if (!confirm(`Excluir permanentemente a viagem "${trip.city}, ${trip.country}"?`)) return;
        this.state.trips = this.state.trips.filter(t => t.id !== tripId);
        this.state.openCardMenuId = null;
        this.saveState();
        if (this.state.selectedTripId === tripId) this.goHome();
        else this.render();
        this.toast('Destino removido.');
      },

      addDayToTrip(tripId) {
        const trip = this.state.trips.find(t => t.id === tripId);
        if (!trip) return;
        const nextNum = (trip.days || []).length + 1;
        trip.days.push({
          id: 'day-' + Date.now(),
          dayNumber: nextNum,
          title: `Exploração Editorial — Dia ${nextNum}`,
          weatherDress: 'Conforto urbano • Consulte previsão matinal',
          openingLogistics: 'Saída da hospedagem base após o café.',
          activities: []
        });
        trip.durationDays = trip.days.length;
        this.state.selectedDayIndex = trip.days.length - 1;
        this.saveState();
        this.render();
        this.toast(`Dia ${nextNum} adicionado!`);
      },

      deleteDayFromTrip(tripId, dayIndex) {
        const trip = this.state.trips.find(t => t.id === tripId);
        if (!trip || !trip.days[dayIndex]) return;
        if (trip.days.length <= 1) {
          this.toast('A viagem precisa manter pelo menos 1 dia.', 'error');
          return;
        }
        const day = trip.days[dayIndex];
        if (!confirm(`Excluir o Dia ${day.dayNumber} ("${day.title}") e todas as suas atividades?`)) return;
        trip.days.splice(dayIndex, 1);
        trip.days.forEach((d, idx) => { d.dayNumber = idx + 1; });
        trip.durationDays = trip.days.length;
        this.state.selectedDayIndex = Math.max(0, dayIndex - 1);
        this.saveState();
        this.render();
        this.toast('Dia removido e numeração reajustada.');
      },

      deleteActivity(tripId, dayIndex, actId, ev) {
        if (ev) ev.stopPropagation();
        if (!confirm('Remover esta atividade do dia?')) return;
        const trip = this.state.trips.find(t => t.id === tripId);
        if (!trip || !trip.days[dayIndex]) return;
        trip.days[dayIndex].activities = trip.days[dayIndex].activities.filter(a => a.id !== actId);
        this.saveState();
        this.render();
        this.toast('Atividade removida.');
      },

      togglePrepItem(tripId, itemId) {
        const trip = this.state.trips.find(t => t.id === tripId);
        if (!trip || !trip.prepChecklist) return;
        const item = trip.prepChecklist.find(i => i.id === itemId);
        if (!item) return;
        item.done = !item.done;
        this.saveState();
        this.render();
      },

      addPrepItem(event, tripId) {
        event.preventDefault();
        const f = event.target;
        const trip = this.state.trips.find(t => t.id === tripId);
        if (!trip) return;
        const text = f.text.value.trim();
        const category = f.category.value;
        if (!text) return;
        if (!trip.prepChecklist) trip.prepChecklist = [];
        trip.prepChecklist.push({
          id: 'chk-' + Date.now(),
          category,
          text,
          done: false
        });
        this.saveState();
        this.render();
        this.toast('Item adicionado ao Checklist!');
      },

      deletePrepItem(tripId, itemId) {
        const trip = this.state.trips.find(t => t.id === tripId);
        if (!trip || !trip.prepChecklist) return;
        trip.prepChecklist = trip.prepChecklist.filter(i => i.id !== itemId);
        this.saveState();
        this.render();
      },

      deleteGastronomy(tripId, gasId) {
        const trip = this.state.trips.find(t => t.id === tripId);
        if (!trip) return;
        trip.gastronomy = trip.gastronomy.filter(g => g.id !== gasId);
        this.saveState();
        this.render();
        this.toast('Endereço removido.');
      },

      addExpense(event, tripId) {
        event.preventDefault();
        const form = event.target;
        const trip = this.state.trips.find(t => t.id === tripId);
        if (!trip) return;
        const title = form.title.value.trim();
        const category = form.category.value;
        const amount = parseFloat(form.amount.value);
        const currency = form.currency.value;
        if (!title || isNaN(amount) || amount <= 0) {
          this.toast('Informe uma descrição e valor válido.', 'error');
          return;
        }
        if (!trip.expenses) trip.expenses = [];
        trip.expenses.unshift({
          id: 'exp-' + Date.now(),
          title,
          category,
          amount,
          currency
        });
        this.saveState();
        this.render();
        this.toast('Despesa lançada!');

        const trip = this.state.trips.find(t => t.id === tripId);

        this.toast('Despesa excluída.');

      async handleManualOrEditTripSave(event, existingTripId = null) {
        event.preventDefault();
        const f = event.target;
        const city = f.city.value.trim();
        const country = f.country.value.trim();
        const startDate = f.startDate.value || '';
        const endDate = f.endDate.value || startDate;
        const datesDisplay = this.formatDisplayDatesFromISO(startDate, endDate);
        const year = startDate ? startDate.slice(0, 4) : String(new Date().getFullYear());

        let coverUrl = this.state.modalCoverTemp;
        if (!coverUrl) {
          coverUrl = await this.resolveSmartCover(city, country);
        }

        let calcDaysCount = 3;
        if (startDate && endDate) {
          const diffMs = new Date(endDate + 'T12:00:00') - new Date(startDate + 'T12:00:00');
          const d = Math.round(diffMs / 86400000) + 1;
          if (d >= 1 && d <= 45) calcDaysCount = d;
        }

        if (existingTripId) {
          const trip = this.state.trips.find(t => t.id === existingTripId);
          if (!trip) return;
          trip.city = city;
          trip.country = country;
          trip.flag = f.flag.value.trim() || '🌍';
          trip.localCurrency = f.localCurrency.value || 'EUR';
          trip.subtitle = f.subtitle.value.trim() || `Dossiê autoral em ${city}`;
          trip.startDate = startDate;
          trip.endDate = endDate;
          trip.dates = datesDisplay;
          trip.year = year;
          trip.status = f.status.value;
          trip.coverUrl = coverUrl;
          trip.budgetEstimated = {
            transport: parseFloat(f.budgetTransport.value) || 0,
            attractions: parseFloat(f.budgetAttractions.value) || 0,
            food: parseFloat(f.budgetFood.value) || 0
          };
          trip.logistics = {
            ...trip.logistics,
            mode: f.transportMode.value || 'plane',
            transportType: f.transportType.value.trim() || 'Transporte Principal',
            pnr: (f.pnr.value.trim() || 'PENDENTE').toUpperCase(),
            route: f.route.value.trim() || `Origem → ${city}`,
            schedule: f.schedule ? f.schedule.value.trim() : (trip.logistics.schedule || 'Horários a definir'),
            hotelName: f.hotelName.value.trim() || 'Hospedagem Base',
            hotelAddress: f.hotelAddress.value.trim() || `${city}, ${country}`
          };
          this.saveState();
          this.closeModal();
          this.render();
          this.toast('Viagem atualizada com sucesso!');
        } else {
          const days = Array.from({ length: calcDaysCount }, (_, i) => ({
            id: `day-${Date.now()}-${i + 1}`,
            dayNumber: i + 1,
            title: i === 0 ? `Chegada & Primeiros Passos em ${city}` : `Exploração Cultural — Dia ${i + 1}`,
            weatherDress: 'Consulte previsão local • Calçado confortável',
            openingLogistics: i === 0 ? 'Desembarque, deslocamento ao centro e check-in.' : 'Saída matinal da hospedagem.',
            activities: []
          }));

          const newTrip = this.migrateTripToV2({
            id: 'trip-' + Date.now(),
            city,
            country,
            flag: f.flag.value.trim() || '🌍',
            localCurrency: f.localCurrency.value || this.inferCurrencyFromCountry(country, city),
            year,
            startDate,
            endDate,
            dates: datesDisplay,
            durationDays: calcDaysCount,
            status: f.status.value,
            subtitle: f.subtitle.value.trim() || `Roteiro editorial por ${city}`,
            coverUrl,
            fallbackGradient: APPLE_GRADIENTS[this.state.trips.length % APPLE_GRADIENTS.length],
            budgetEstimated: {
              transport: parseFloat(f.budgetTransport.value) || 0,
              attractions: parseFloat(f.budgetAttractions.value) || 0,
              food: parseFloat(f.budgetFood.value) || 0
            },
            expenses: [],
            logistics: {
              mode: f.transportMode.value || 'plane',
              transportType: f.transportType.value.trim() || 'Transporte Principal',
              route: f.route.value.trim() || `Origem → ${city}`,
              schedule: 'Consulte confirmação de reserva',
              pnr: (f.pnr.value.trim() || 'ATLAS20').toUpperCase(),
              transportNotes: 'Verifique check-in, franquia e conexão até o centro.',
              hotelName: f.hotelName.value.trim() || 'Hospedagem Base',
              hotelAddress: f.hotelAddress.value.trim() || `${city}, ${country}`,
              checkInOut: 'Check-in: 15:00 • Check-out: 11:00',
              ticketingRules: 'Valide sempre passes e bilhetes antes do embarque.',
              studentDiscounts: 'Verifique tarifas reduzidas estudantis / jovens.',
              currencyVocab: `Cartão multimoeda recomendado + expressões básicas de cortesia em ${city}.`
            },
            prepChecklist: JSON.parse(JSON.stringify(DEFAULT_PREP_CHECKLIST)),
            contingency: {
              planB: `Roteiro coberto alternativo em ${city}: principais museus, galerias e mercados gastronômicos.`,
              souvenirs: `Especialidades locais e lembranças autênticas de ${city}.`
            },
            gastronomy: [],
            days
          });

          this.state.trips.unshift(newTrip);
          this.saveState();
          this.closeModal();
          this.openTrip(newTrip.id);
          this.toast(`Viagem para ${city} criada!`);
        }
      },

      async handleParseFreeMarkdown(event) {
        event.preventDefault();
        const btn = document.getElementById('btnSubmitParser');
        if (btn) btn.textContent = 'Estruturando e buscando capa...';

        const raw = event.target.rawText.value || '';
        const lines = raw.split(/\r?\n/).map(l => l.trim()).filter(Boolean);

        let city = '';
        let country = 'Europa';
        let flag = '✈️';
        let dates = 'Datas a definir • 2025';
        let status = 'Em Planejamento';
        let subtitle = 'Curadoria importada via Markdown Inteligente';
        let transportType = 'Transporte Principal';
        let route = '';
        let pnr = 'ATLAS20';
        let hotelName = 'Hospedagem Base';
        let hotelAddress = '';
        let budgetEstimated = { transport: 40, attractions: 55, food: 80 };

        const days = [];
        const gastronomy = [];
        let currentDay = null;
        let inGastronomy = false;

        lines.forEach((origLine, idx) => {
          // Detecta título principal Markdown "# Praga, República Tcheca 🇨🇿"
          if (idx === 0 && /^#\s+/.test(origLine) && !/^#+\s*dia\s*\d/i.test(origLine)) {
            const h1 = origLine.replace(/^#+\s*/, '').trim();
            const emojiMatch = h1.match(/([\uD83C][\uDDE6-\uDDFF][\uD83C][\uDDE6-\uDDFF])/);
            if (emojiMatch) flag = emojiMatch[1];
            const cleanH1 = h1.replace(/([\uD83C][\uDDE6-\uDDFF][\uD83C][\uDDE6-\uDDFF])/g, '').trim();
            const parts = cleanH1.split(/[,-–—]/).map(s => s.trim()).filter(Boolean);
            if (parts[0]) city = parts[0];
            if (parts[1]) country = parts[1];
            return;
          }

          const line = origLine.replace(/^#+\s*/, '').replace(/^[-*•]\s*/, '').replace(/^\*\*(.+?)\*\*/, '$1').trim();

          if (/^cidade\s*:/i.test(line)) { city = line.split(':').slice(1).join(':').trim(); return; }
          if (/^pa[íi]s\s*:/i.test(line)) { country = line.split(':').slice(1).join(':').trim(); return; }
          if (/^bandeira\s*:/i.test(line)) { flag = line.split(':').slice(1).join(':').trim(); return; }
          if (/^datas?\s*:/i.test(line)) { dates = line.split(':').slice(1).join(':').trim(); return; }
          if (/^subt[íi]tulo\s*:/i.test(line)) { subtitle = line.split(':').slice(1).join(':').trim(); return; }
          if (/^(transporte|voo|trem|ônibus|onibus)\s*:/i.test(line)) {
            const val = line.split(':').slice(1).join(':').trim();
            const pnrM = val.match(/pnr\s*[:=-]?\s*([A-Z0-9-]+)/i);
            if (pnrM) pnr = pnrM[1].toUpperCase();
            const parts = val.split('|').map(s => s.trim());
            transportType = parts[0].replace(/pnr\s*[:=-]?\s*[A-Z0-9-]+/i, '').trim() || transportType;
            if (parts[1]) route = parts[1];
            return;
          }
          if (/^(hospedagem|hotel|hostel)\s*:/i.test(line)) {
            const val = line.split(':').slice(1).join(':').trim();
            const parts = val.includes('|') ? val.split('|') : val.split(',');
            hotelName = (parts[0] || hotelName).trim();
            hotelAddress = parts.slice(1).join(',').trim();
            return;
          }
          if (/^(gastronomia|restaurantes|onde comer)\s*:?$/i.test(line)) {
            inGastronomy = true;
            currentDay = null;
            return;
          }

          const dayMatch = line.match(/^dia\s*(\d+)\s*[-–—:]?\s*(.*)$/i);
          if (dayMatch) {
            inGastronomy = false;
            currentDay = {
              id: 'day-' + Date.now() + '-' + dayMatch[1] + '-' + idx,
              dayNumber: parseInt(dayMatch[1], 10),
              title: dayMatch[2] ? dayMatch[2].trim() : `Descobertas do Dia ${dayMatch[1]}`,
              weatherDress: 'Camadas confortáveis & calçado urbano',
              openingLogistics: `Saída matinal para explorar ${city || 'o destino'}.`,
              activities: []
            };
            days.push(currentDay);
            return;
          }

          if (currentDay && /^clima\s*:/i.test(line)) {
            currentDay.weatherDress = line.split(':').slice(1).join(':').trim();
            return;
          }

          if (inGastronomy) {
            let name = line, neighborhood = city || 'Centro', mustTry = 'Especialidade da Casa', priceRange = '€€';
            if (line.includes('|')) {
              const gp = line.split('|').map(s => s.trim());
              name = gp[0]; neighborhood = gp[1] || neighborhood; mustTry = gp[2] || mustTry; priceRange = gp[3] || '€€';
            } else {
              // Ex: "Lokál Dlouhááá (Staré Město): Smažený sýr + Pilsner"
              const colonSplit = line.split(/[:—–]/);
              const left = colonSplit[0].trim();
              if (colonSplit[1]) mustTry = colonSplit.slice(1).join(':').trim();
              const paren = left.match(/^(.+?)\s*$(.+?)$$/);
              if (paren) { name = paren[1].trim(); neighborhood = paren[2].trim(); }
              else name = left;
            }
            gastronomy.push({
              id: 'gas-' + Date.now() + '-' + idx,
              name,
              neighborhood,
              dayRef: 'Curadoria Importada',
              mustTry,
              priceRange,
              query: `${name} ${city}`,
              notes: 'Importado automaticamente do seu guia.'
            });
            return;
          }

          // Detecta horário em formato livre: "09:30 | ...", "09:30 - ...", "9h30 Título..."
          const timeFree = line.match(/^(\d{1,2}[:h]\d{2})\s*(?:[|–—:-]\s*)?(.+)$/i);
          if (timeFree) {
            const formattedTime = timeFree[1].replace(/h/i, ':').padStart(5, '0');
            const rest = timeFree[2].trim();
            if (!currentDay) {
              currentDay = {
                id: 'day-' + Date.now() + '-1',
                dayNumber: 1,
                title: `Essência de ${city || 'Viagem'}`,
                weatherDress: 'Look urbano confortável',
                openingLogistics: 'Início das atividades.',
                activities: []
              };
              days.push(currentDay);
            }

            let actTitle = rest, neighborhood = city || 'Centro', cost = '€ 0,00', history = '', secret = '';
            if (rest.includes('|')) {
              const p = rest.split('|').map(s => s.trim());
              actTitle = p[0]; neighborhood = p[1] || neighborhood; cost = p[2] || cost; history = p[3] || ''; secret = p[4] || '';
            } else {
              // Extrai custo entre parênteses ex: "(€ 18,00)"
              const costM = rest.match(/$(€\s*[\d.,]+|R\$\s*[\d.,]+|gratuito|free)$/i);
              if (costM) cost = costM[1];
              const cleanRest = rest.replace(/$(€\s*[\d.,]+|R\$\s*[\d.,]+|gratuito|free)$/ig, '').trim();
              const segSplit = cleanRest.split(/segredo\s*:/i);
              if (segSplit[1]) secret = segSplit[1].trim();
              const descSplit = segSplit[0].split(/\s+[—–-]\s+/);
              actTitle = descSplit[0].trim();
              history = descSplit.slice(1).join(' — ').trim();
            }

            currentDay.activities.push({
              id: 'act-' + Date.now() + '-' + idx,
              time: formattedTime,
              title: actTitle,
              neighborhood,
              cost,
              done: false,
              query: `${actTitle} ${city}`,
              history: history || `Visita selecionada no roteiro de ${city || 'viagem'}.`,
              curatorEye: `Observe a arquitetura, a luz natural e o movimento local em ${actTitle}.`,
              secret: secret.replace(/^segredo\s*:\s*/i, '') || 'Caminhe pelas ruas laterais menos movimentadas ao redor para melhores ângulos.'
            });
          } else if (currentDay && origLine.startsWith('-') && line.length > 4) {
            // Item de lista sem horário explícito dentro de um dia
            const autoHour = String(9 + currentDay.activities.length * 2).padStart(2, '0') + ':30';
            currentDay.activities.push({
              id: 'act-' + Date.now() + '-' + idx,
              time: autoHour,
              title: line.slice(0, 68),
              neighborhood: city || 'Exploração',
              cost: '€ 0,00',
              done: false,
              query: `${line.slice(0, 50)} ${city}`,
              history: line,
              curatorEye: 'Ponto incluído por lista rápida Markdown.',
              secret: 'Aproveite sem pressa.'
            });
          }
        });

        if (!city) city = 'Novo Destino';
        if (days.length === 0) {
          days.push({
            id: 'day-' + Date.now(),
            dayNumber: 1,
            title: `Descobertas em ${city}`,
            weatherDress: 'Conforto urbano',
            openingLogistics: 'Saída matinal.',
            activities: []
          });
        }

        const coverUrl = this.state.modalCoverTemp || (await this.resolveSmartCover(city, country));
        const inferredDates = this.inferDatesFromText(dates, '2025');

        const newTrip = this.migrateTripToV2({
          id: 'trip-' + Date.now(),
          city,
          country,
          flag,
          year: inferredDates.startDate ? inferredDates.startDate.slice(0, 4) : '2025',
          startDate: inferredDates.startDate,
          endDate: inferredDates.endDate,
          dates,
          durationDays: days.length,
          status,
          subtitle,
          coverUrl,
          budgetEstimated,
          expenses: [],
          logistics: {
            mode: this.inferTransportMode(transportType),
            transportType,
            route: route || `Origem → ${city}`,
            schedule: 'Consulte reserva',
            pnr,
            transportNotes: 'Verifique horários e deslocamento até a hospedagem.',
            hotelName,
            hotelAddress: hotelAddress || `${city}, ${country}`,
            checkInOut: 'Check-in: 15:00 • Check-out: 11:00',
            ticketingRules: 'Valide bilhetes locais sempre antes do embarque.',
            studentDiscounts: 'Consulte descontos estudantis / jovens.',
            currencyVocab: `Pagamentos digitais amplamente aceitos em ${city}.`
          },
          gastronomy,
          days
        });

        this.state.trips.unshift(newTrip);
        this.saveState();
        this.closeModal();
        this.openTrip(newTrip.id);
        this.toast(`Roteiro de ${city} estruturado com ${days.length} dia(s)!`);
      },

      async handleImportAiJson(event) {
        event.preventDefault();
        const btn = document.getElementById('btnSubmitAiJson');
        if (btn) btn.textContent = 'Construindo destino & capa...';

        let raw = event.target.aiJsonText.value.trim();
        // Remove cercas ```json eventuais
        raw = raw.replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/, '').trim();

        try {
          const data = JSON.parse(raw);
          const city = data.city || 'Destino IA';
          const country = data.country || 'Internacional';
          const coverUrl = data.coverUrl && data.coverUrl.startsWith('http')
            ? data.coverUrl
            : await this.resolveSmartCover(city, country);

          const days = (data.days || []).map((d, i) => ({
            id: `day-${Date.now()}-${i + 1}`,
            dayNumber: d.dayNumber || (i + 1),
            title: d.title || `Dia ${i + 1}`,
            weatherDress: d.weatherDress || 'Clima ameno • Calçado confortável',
            openingLogistics: d.openingLogistics || `Exploração de ${city}`,
            activities: (d.activities || []).map((a, j) => ({
              id: `act-${Date.now()}-${i}-${j}`,
              time: a.time || '10:00',
              title: a.title || 'Atividade',
              neighborhood: a.neighborhood || city,
              cost: a.cost || '€ 0,00',
              done: !!a.done,
              query: a.query || `${a.title || ''} ${city}`,
              history: a.history || '',
              curatorEye: a.curatorEye || '',
              secret: a.secret || ''
            }))
          }));

          const gastronomy = (data.gastronomy || []).map((g, i) => ({
            id: `gas-${Date.now()}-${i}`,
            name: g.name || 'Restaurante',
            neighborhood: g.neighborhood || city,
            dayRef: g.dayRef || 'Sugestão do Concierge',
            mustTry: g.mustTry || 'Prato da Casa',
            priceRange: g.priceRange || '€€',
            query: g.query || `${g.name || ''} ${city}`,
            notes: g.notes || ''
          }));

          const newTrip = this.migrateTripToV2({
            id: 'trip-' + Date.now(),
            city,
            country,
            flag: data.flag || '✨',
            localCurrency: data.localCurrency || this.inferCurrencyFromCountry(country, city),
            startDate: data.startDate || '',
            endDate: data.endDate || data.startDate || '',
            dates: data.dates || this.formatDisplayDatesFromISO(data.startDate, data.endDate),
            year: (data.startDate || '2025').slice(0, 4),
            durationDays: days.length || 1,
            status: data.status || 'Em Planejamento',
            subtitle: data.subtitle || `Curadoria gerada sob medida para ${city}`,
            coverUrl,
            budgetEstimated: data.budgetEstimated || { transport: 45, attractions: 70, food: 95 },
            expenses: [],
            logistics: data.logistics || {},
            contingency: data.contingency || {},
            gastronomy,
            days
          });

          this.state.trips.unshift(newTrip);
          this.saveState();
          this.closeModal();
          this.openTrip(newTrip.id);
          this.toast(`${city} importado via IA com sucesso!`);
        } catch (err) {
          if (btn) btn.textContent = 'Criar Viagem Completa';
          this.toast('JSON inválido. Verifique se copiou todo o bloco gerado pela IA.', 'error');
        }
      },

      saveActivityModal(event, tripId, dayIndex, actId) {
        event.preventDefault();
        const f = event.target;
        const trip = this.state.trips.find(t => t.id === tripId);
        if (!trip || !trip.days[dayIndex]) return;
        const day = trip.days[dayIndex];

        const payload = {
          id: actId || ('act-' + Date.now()),
          time: f.time.value.trim(),
          title: f.title.value.trim(),
          neighborhood: f.neighborhood.value.trim(),
          cost: f.cost.value.trim() || '€ 0,00',
          query: f.query.value.trim() || `${f.title.value.trim()} ${trip.city}`,
          history: f.history.value.trim() || 'Contexto anotado pelo viajante.',
          curatorEye: f.curatorEye.value.trim() || 'Observe a atmosfera arquitetônica e os detalhes locais.',
          secret: f.secret.value.trim() || 'Dica especial registrada no dossiê.',
          done: actId ? (day.activities.find(a => a.id === actId)?.done || false) : false
        };

        if (actId) {
          const idx = day.activities.findIndex(a => a.id === actId);
          if (idx > -1) day.activities[idx] = payload;
        } else {
          day.activities.push(payload);
          day.activities.sort((a, b) => a.time.localeCompare(b.time));
          this.state.expandedActivities[payload.id] = true;
        }

        this.saveState();
        this.closeModal();
        this.render();
        this.toast(actId ? 'Atividade atualizada!' : 'Atividade adicionada!');
      },

      saveLogisticsModal(event, tripId) {
        event.preventDefault();
        const f = event.target;
        const trip = this.state.trips.find(t => t.id === tripId);
        if (!trip) return;
        trip.logistics = {
          mode: f.mode.value || 'plane',
          transportType: f.transportType.value.trim(),
          pnr: f.pnr.value.trim().toUpperCase(),
          route: f.route.value.trim(),
          schedule: f.schedule.value.trim(),
          transportNotes: f.transportNotes.value.trim(),
          hotelName: f.hotelName.value.trim(),
          hotelAddress: f.hotelAddress.value.trim(),
          checkInOut: f.checkInOut.value.trim(),
          ticketingRules: f.ticketingRules.value.trim(),
          studentDiscounts: f.studentDiscounts.value.trim(),
          currencyVocab: f.currencyVocab.value.trim()
        };
        this.saveState();
        this.closeModal();
        this.render();
        this.toast('Logística atualizada!');
      },

      handleAddGastronomy(event, tripId) {
        event.preventDefault();
        const f = event.target;
        const trip = this.state.trips.find(t => t.id === tripId);
        if (!trip) return;
        const name = f.name.value.trim();
        const mustTry = f.mustTry.value.trim();
        if (!name || !mustTry) return;

        trip.gastronomy.unshift({
          id: 'gas-' + Date.now(),
          name,
          neighborhood: f.neighborhood.value.trim() || trip.city,
          dayRef: f.dayRef.value.trim() || 'Descoberta Local',
          mustTry,
          priceRange: f.priceRange.value,
          query: `${name} ${f.neighborhood.value.trim() || trip.city}`,
          notes: f.notes.value.trim() || 'Adicionado na rua durante a viagem.'
        });
        this.saveState();
        this.render();
        this.toast(`"${name}" salvo na curadoria!`);
      },

      openEditContingencyModal(tripId) {
        const trip = this.state.trips.find(t => t.id === tripId);
        if (!trip) return;
        const b = trip.budgetEstimated || { transport: 0, attractions: 0, food: 0 };
        const c = trip.contingency || { planB: '', souvenirs: '' };

        const html = `
          <div class="px-6 py-4 border-b border-white/10 flex items-center justify-between">
            <h3 class="text-base font-semibold text-white">Editar Metas, Plano B & Vocabulário</h3>
            <button onclick="app.closeModal()" class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center text-zinc-300">
              <i data-lucide="x" class="w-4 h-4"></i>
            </button>
          </div>
          <form onsubmit="app.saveContingencyModal(event, '${tripId}')" class="p-6 space-y-4 text-xs">
            <div class="grid grid-cols-3 gap-3">
              <div>
                <label class="block font-medium text-zinc-300 mb-1">Meta Transporte (€)</label>
                <input name="transport" type="number" step="0.01" value="${b.transport}" class="w-full rounded-xl bg-black/60 border border-white/10 px-3 py-2 text-white font-mono" />
              </div>
              <div>
                <label class="block font-medium text-zinc-300 mb-1">Meta Atrações (€)</label>
                <input name="attractions" type="number" step="0.01" value="${b.attractions}" class="w-full rounded-xl bg-black/60 border border-white/10 px-3 py-2 text-white font-mono" />
              </div>
              <div>
                <label class="block font-medium text-zinc-300 mb-1">Meta Alimentação (€)</label>
                <input name="food" type="number" step="0.01" value="${b.food}" class="w-full rounded-xl bg-black/60 border border-white/10 px-3 py-2 text-white font-mono" />
              </div>
            </div>
            <div>
              <label class="block font-medium text-zinc-300 mb-1">Plano B (Chuva Forte ou Imprevistos)</label>
              <textarea name="planB" rows="3" class="w-full rounded-xl bg-black/60 border border-white/10 p-3 text-zinc-200">${this.escape(c.planB)}</textarea>
            </div>
            <div>
              <label class="block font-medium text-zinc-300 mb-1">Souvenirs & Experiências Autênticas</label>
              <textarea name="souvenirs" rows="2" class="w-full rounded-xl bg-black/60 border border-white/10 p-3 text-zinc-200">${this.escape(c.souvenirs)}</textarea>
            </div>
            <div>
              <label class="block font-medium text-zinc-300 mb-1">Moeda & Vocabulário Rápido</label>
              <textarea name="currencyVocab" rows="2" class="w-full rounded-xl bg-black/60 border border-white/10 p-3 text-zinc-200">${this.escape(trip.logistics?.currencyVocab || '')}</textarea>
            </div>
            <div class="pt-2 flex justify-end gap-2">
              <button type="button" onclick="app.closeModal()" class="px-4 py-2 rounded-full bg-[#2C2C2E] text-zinc-200">Cancelar</button>
              <button type="submit" class="px-5 py-2 rounded-full bg-[#0A84FF] text-white font-semibold">Salvar</button>
            </div>
          </form>
        `;
        this.openModal(html);
      },

      saveContingencyModal(event, tripId) {
        event.preventDefault();
        const f = event.target;
        const trip = this.state.trips.find(t => t.id === tripId);
        if (!trip) return;
        trip.budgetEstimated = {
          transport: parseFloat(f.transport.value) || 0,
          attractions: parseFloat(f.attractions.value) || 0,
          food: parseFloat(f.food.value) || 0
        };
        trip.contingency = {
          planB: f.planB.value.trim(),
          souvenirs: f.souvenirs.value.trim()
        };
        if (trip.logistics && f.currencyVocab) {
          trip.logistics.currencyVocab = f.currencyVocab.value.trim();
        }
        this.saveState();
        this.closeModal();
        this.render();
        this.toast('Metas e guia atualizados!');
      },

      // =========================================================================
      // RENDERIZAÇÃO APPLE UI (HOME, CALENDÁRIO MENSAL & DASHBOARD DE VIAGEM)
      // =========================================================================
      getStatusBadgeClasses(status) {
        if (status === 'Próximas') return 'bg-[#30D158]/20 text-[#30D158] border-[#30D158]/35';
        if (status === 'Concluídas') return 'bg-[#0A84FF]/20 text-[#64D2FF] border-[#0A84FF]/35';
        return 'bg-[#FF9F0A]/20 text-[#FF9F0A] border-[#FF9F0A]/35';
      },

      getStatusCalendarBarClasses(status) {
        if (status === 'Próximas') return 'bg-[#30D158]/25 text-[#30D158] border-[#30D158]/40 hover:bg-[#30D158]/35';
        if (status === 'Concluídas') return 'bg-[#0A84FF]/25 text-[#64D2FF] border-[#0A84FF]/40 hover:bg-[#0A84FF]/35';
        return 'bg-[#FF9F0A]/25 text-[#FF9F0A] border-[#FF9F0A]/40 hover:bg-[#FF9F0A]/35';
      },

      render() {
        const root = document.getElementById('appRoot');
        if (this.state.view === 'trip' && this.getSelectedTrip()) {
          root.innerHTML = this.renderTripDashboard(this.getSelectedTrip());
        } else {
          root.innerHTML = this.renderHome();
        }
        this.updateMobileTabBarHighlight();
        lucide.createIcons();
      },

        const totalDays = trips.reduce((acc, t) => acc + (Number(t.durationDays) || (t.days ? t.days.length : 0)), 0);
        const totalBudgetEUR = trips.reduce((acc, t) => acc + this.getTripEstimatedTotal(t), 0);
