                          <!-- Progresso Estilo iOS -->
                          <div>
                            <div class="flex items-center justify-between text-[11px] mb-1.5">
                              <span class="text-zinc-400">Roteiro concluído</span>
                              <span class="font-mono text-zinc-200">${prog.done}/${prog.total} (${prog.pct}%)</span>
                            </div>
                            <div class="w-full h-1.5 rounded-full bg-white/10 overflow-hidden">
                              <div class="h-full rounded-full bg-gradient-to-r from-[#0A84FF] to-[#30D158] transition-all duration-500" style="width: ${prog.pct}%"></div>
                            </div>
                          </div>
                        </div>
                      </article>
                    `;
                  }).join('')}

                  <!-- Card Adicionar Nova Viagem -->
                  <button onclick="app.openNewTripModal('parser')" class="min-h-[340px] rounded-3xl border border-dashed border-white/15 hover:border-[#0A84FF]/60 bg-[#1C1C1E]/40 hover:bg-[#1C1C1E]/80 p-6 flex flex-col items-center justify-center text-center gap-3.5 transition group">
                    <div class="w-14 h-14 rounded-3xl bg-white/[0.06] group-hover:bg-[#0A84FF]/20 border border-white/10 group-hover:border-[#0A84FF]/40 flex items-center justify-center transition">
                      <i data-lucide="plus" class="w-6 h-6 text-zinc-300 group-hover:text-[#64D2FF]"></i>
                    </div>
                    <div>
                      <h3 class="text-sm font-semibold text-white">Nova Viagem ou Gerar com IA</h3>
                      <p class="text-xs text-zinc-400 mt-1 max-w-[240px] leading-relaxed">Capa automática via Wikipedia, importação Markdown livre ou Prompt Concierge IA.</p>
                    </div>
                  </button>
                </section>
              `}
            `}
          </div>
        `;
      },

      // =========================================================================
      // VISUALIZAÇÃO EM CALENDÁRIO MENSAL INTERATIVO (ESTILO APPLE CALENDAR)
      // =========================================================================
      renderMonthlyCalendarView() {
        const year = this.state.calendarYear;
        const month = this.state.calendarMonth; // 0..11
        const firstDayOfWeek = new Date(year, month, 1).getDay(); // 0 Dom .. 6 Sáb
        const daysInMonth = new Date(year, month + 1, 0).getDate();

        const weekDays = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];

        // Meses com viagens cadastradas para atalho rápido
        const tripMonths = [];
        const seenYM = new Set();
        this.state.trips.forEach(t => {
          if (t.startDate) {
            const [ty, tm] = t.startDate.split('-').map(Number);
            const key = `${ty}-${tm}`;
            if (ty && tm && !seenYM.has(key)) {
              seenYM.add(key);
              tripMonths.push({ year: ty, month: tm - 1, label: `${t.flag} ${t.city.split(' ')[0]} (${MONTH_SHORT_PT[tm - 1]} ${ty})` });
            }
          }
        });

        let cellsHtml = '';
        for (let i = 0; i < firstDayOfWeek; i++) {
          cellsHtml += `<div class="min-h-[84px] sm:min-h-[104px] rounded-2xl bg-white/[0.02] border border-white/[0.04]"></div>`;
        }

        const todayISO = new Date().toISOString().slice(0, 10);

        for (let d = 1; d <= daysInMonth; d++) {
          const dateISO = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
          const isToday = dateISO === todayISO;
          const matchingTrips = this.state.trips.filter(t => t.startDate && t.endDate && dateISO >= t.startDate && dateISO <= t.endDate);

          cellsHtml += `
            <div
              ${matchingTrips.length > 0 ? `onclick="app.openTrip('${matchingTrips[0].id}')"` : ''}
              class="min-h-[84px] sm:min-h-[104px] rounded-2xl p-2 border transition flex flex-col justify-between ${
                matchingTrips.length > 0
                  ? 'cursor-pointer bg-[#2C2C2E]/75 border-white/15 hover:border-white/35'
                  : 'bg-[#1C1C1E]/60 border-white/[0.07]'
              }"
            >
              <div class="flex items-center justify-between">
                <span class="w-6 h-6 rounded-full text-xs font-semibold flex items-center justify-center ${
                  isToday ? 'bg-[#FF453A] text-white' : 'text-zinc-300'
                }">${d}</span>
                ${matchingTrips.length > 0 ? `<span class="text-xs">${this.escape(matchingTrips[0].flag)}</span>` : ''}
              </div>

              <div class="space-y-1 mt-1">
                ${matchingTrips.map(mt => `
                  <button
                    type="button"
                    onclick="event.stopPropagation(); app.openTrip('${mt.id}')"
                    class="w-full text-left px-2 py-1 rounded-lg text-[10px] sm:text-[11px] font-semibold border truncate transition ${this.getStatusCalendarBarClasses(mt.status)}"
                  >
                    ${this.escape(mt.city)}
                  </button>
                `).join('')}
              </div>
            </div>
          `;
        }

        return `
          <section class="rounded-3xl apple-card p-5 sm:p-7 space-y-6 animate-apple">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
              <div class="flex items-center gap-3">
                <button onclick="app.shiftCalendarMonth(-1)" class="w-9 h-9 rounded-full bg-[#2C2C2E] hover:bg-[#3A3A3C] border border-white/10 flex items-center justify-center text-white transition">
                  <i data-lucide="chevron-left" class="w-4 h-4"></i>
                </button>
                <div class="min-w-[180px] text-center">
                  <h2 class="text-xl font-bold text-white tracking-tight">${MONTH_NAMES_FULL[month]} ${year}</h2>
                </div>
                <button onclick="app.shiftCalendarMonth(1)" class="w-9 h-9 rounded-full bg-[#2C2C2E] hover:bg-[#3A3A3C] border border-white/10 flex items-center justify-center text-white transition">
                  <i data-lucide="chevron-right" class="w-4 h-4"></i>
                </button>
              </div>

              <!-- Pílulas de Salto Rápido para Meses com Viagens -->
              <div class="flex items-center gap-2 overflow-x-auto no-scrollbar">
                <span class="text-[11px] text-zinc-500 shrink-0">Ir para:</span>
                ${tripMonths.map(tm => `
                  <button onclick="app.jumpToCalendarMonth(${tm.year}, ${tm.month})" class="shrink-0 px-3 py-1.5 rounded-full text-xs font-medium border transition ${
                    tm.year === year && tm.month === month
                      ? 'bg-white text-black border-white'
                      : 'bg-[#2C2C2E] text-zinc-300 border-white/10 hover:text-white'
                  }">
                    ${this.escape(tm.label)}
                  </button>
                `).join('')}
              </div>
            </div>

            <!-- Legenda de Status -->
            <div class="flex flex-wrap items-center gap-4 text-xs text-zinc-400">
              <span class="inline-flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-[#30D158]"></span> Próximas</span>
              <span class="inline-flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-[#FF9F0A]"></span> Em Planejamento</span>
              <span class="inline-flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-[#0A84FF]"></span> Concluídas</span>
              <span class="text-zinc-500">• Clique em qualquer dia marcado para abrir o roteiro</span>
            </div>

            <!-- Grade do Calendário -->
            <div>
              <div class="grid grid-cols-7 gap-2 mb-2 text-center text-[11px] font-semibold uppercase tracking-wider text-zinc-500">
                ${weekDays.map(w => `<div>${w}</div>`).join('')}
              </div>
              <div class="grid grid-cols-7 gap-1.5 sm:gap-2.5">
                ${cellsHtml}
              </div>
            </div>
          </section>
        `;
      },

      // =========================================================================
      // DASHBOARD INTERNO DA VIAGEM (APPLE WALLET LIVE ACTIVITY + 5 ABAS)
      // =========================================================================
      renderTripDashboard(trip) {
        const prog = this.getTripProgress(trip);
        const estTotal = this.getTripEstimatedTotal(trip);
        const nextStep = this.getNextPendingStep(trip);
        const isNonEuro = trip.localCurrency && trip.localCurrency !== 'EUR';
        const prepTotal = (trip.prepChecklist || []).length;
        const prepDone = (trip.prepChecklist || []).filter(i => i.done).length;

        const navTabs = [
          { id: 'itinerary', label: 'Roteiro', icon: 'calendar-clock' },
          { id: 'logistics', label: 'Logística', icon: 'compass' },
          { id: 'gastronomy', label: 'Gastronomia', icon: 'utensils-crossed' },
          { id: 'budget', label: 'Orçamento & Câmbio', icon: 'wallet' },
          { id: 'checklist', label: `Checklist & Guia (${prepDone}/${prepTotal})`, icon: 'check-circle-2' }
        ];

        return `
          <div class="space-y-6 animate-apple">
            <!-- Top Action Bar -->
            <div class="flex flex-wrap items-center justify-between gap-3">
              <button onclick="app.goHome()" class="inline-flex items-center gap-2 text-xs font-semibold text-white px-4 py-2 rounded-full bg-[#1C1C1E] hover:bg-[#2C2C2E] border border-white/10 transition">
                <i data-lucide="chevron-left" class="w-4 h-4"></i>
                <span>Destinos</span>
              </button>

              <div class="flex flex-wrap items-center gap-2">
                <select onchange="app.changeTripStatus('${trip.id}', this.value)" class="px-3.5 py-2 rounded-full bg-[#1C1C1E] border border-white/10 text-xs font-medium text-zinc-200 focus:outline-none">
                  <option value="Próximas" ${trip.status === 'Próximas' ? 'selected' : ''}>Status: Próximas</option>
                  <option value="Em Planejamento" ${trip.status === 'Em Planejamento' ? 'selected' : ''}>Status: Em Planejamento</option>
                  <option value="Concluídas" ${trip.status === 'Concluídas' ? 'selected' : ''}>Status: Concluídas</option>
                </select>

                <button onclick="app.openEditTripModal('${trip.id}')" class="inline-flex items-center gap-1.5 px-4 py-2 rounded-full text-xs font-semibold bg-white hover:bg-zinc-200 text-black transition">
                  <i data-lucide="sliders-horizontal" class="w-3.5 h-3.5"></i>
                  <span>Editar Viagem</span>
                </button>
              </div>
            </div>

            <!-- Banner Editorial Panorâmico -->
            <section class="relative rounded-3xl overflow-hidden border border-white/15 bg-gradient-to-br ${trip.fallbackGradient || 'from-[#0A84FF]/40 via-[#1C1C1E] to-black'} min-h-[240px] sm:min-h-[280px] flex items-end shadow-2xl">
              ${trip.coverUrl ? `
                <img
                  src="${this.escape(trip.coverUrl)}"
                  alt="${this.escape(trip.city)}"
                  onerror="this.style.display='none'"
                  class="absolute inset-0 w-full h-full object-cover"
                />
              ` : ''}
              <div class="absolute inset-0 bg-gradient-to-t from-black via-black/60 to-black/15"></div>

              <div class="relative z-10 w-full p-6 sm:p-8 flex flex-col lg:flex-row lg:items-end justify-between gap-6">
                <div class="space-y-2 max-w-3xl">
                  <div class="flex flex-wrap items-center gap-2">
                    <span class="px-3 py-0.5 rounded-full text-[11px] font-semibold border backdrop-blur-md ${this.getStatusBadgeClasses(trip.status)}">${this.escape(trip.status)}</span>
                    <span class="text-xs font-semibold text-white/90">${this.escape(trip.flag)} ${this.escape(trip.country)}</span>
                    <span class="text-zinc-500">•</span>
                    <span class="text-xs text-zinc-300 font-mono">${this.escape(trip.dates)} (${trip.durationDays} Dias)</span>
                  </div>
                  <h1 class="text-3xl sm:text-5xl font-bold text-white tracking-tight">${this.escape(trip.city)}</h1>
                  <p class="text-sm sm:text-base text-zinc-300 font-normal">${this.escape(trip.subtitle)}</p>
                </div>

                <div class="flex items-center gap-4 apple-glass border border-white/15 rounded-2xl px-5 py-3.5 shrink-0">
                  <div>
                    <div class="text-[10px] font-semibold uppercase tracking-wider text-zinc-400">Orçamento</div>
                    <div class="text-base font-mono font-bold text-white">${this.formatEUR(estTotal)}</div>
                  </div>
                  <div class="h-8 w-[1px] bg-white/15"></div>
                  <div>
                    <div class="text-[10px] font-semibold uppercase tracking-wider text-zinc-400">Progresso</div>
                    <div class="text-base font-mono font-bold text-[#30D158]">${prog.done}/${prog.total} (${prog.pct}%)</div>
                  </div>
                </div>
              </div>
            </section>

            <!-- MODO "AGORA NA VIAGEM" (LIVE ACTIVITY) + MINI CONVERSOR RÁPIDO SE FORA DO EURO -->
            <section class="grid grid-cols-1 ${isNonEuro ? 'lg:grid-cols-3' : ''} gap-4">
              <!-- Widget Apple Wallet / Live Activity: Próximo Passo -->
              <div class="${isNonEuro ? 'lg:col-span-2' : ''} rounded-3xl live-activity-glow p-5 sm:p-6 flex flex-col sm:flex-row sm:items-center justify-between gap-5">
                ${nextStep ? `
                  <div class="space-y-1.5 min-w-0">
                    <div class="inline-flex items-center gap-2 text-[11px] font-semibold uppercase tracking-wider text-[#30D158]">
                      <span class="relative flex h-2 w-2">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-[#30D158] opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2 w-2 bg-[#30D158]"></span>
                      </span>
                      <span>Agora na Viagem • Próximo Passo (Dia ${nextStep.day.dayNumber})</span>
                    </div>
                    <div class="flex items-center gap-2.5 flex-wrap">
                      <span class="px-2.5 py-0.5 rounded-lg bg-white/10 text-white font-mono text-xs font-bold">${this.escape(nextStep.activity.time)}</span>
                      <h3 class="text-base sm:text-lg font-bold text-white truncate">${this.escape(nextStep.activity.title)}</h3>
                    </div>
                    <p class="text-xs text-zinc-300 flex items-center gap-1.5">
                      <i data-lucide="map-pin" class="w-3.5 h-3.5 text-[#64D2FF] shrink-0"></i>
                      <span class="truncate">${this.escape(nextStep.activity.neighborhood)} • ${this.escape(nextStep.activity.cost)}</span>
                    </p>
                  </div>

                  <div class="flex items-center gap-2.5 shrink-0">
                    <button
                      onclick="app.toggleActivityDone('${trip.id}', ${nextStep.dayIdx}, '${nextStep.activity.id}', event)"
                      title="Marcar etapa como concluída"
                      class="px-3.5 py-3 rounded-2xl bg-white/10 hover:bg-white/15 border border-white/15 text-xs font-semibold text-white flex items-center gap-1.5 transition"
                    >
                      <i data-lucide="check" class="w-4 h-4 text-[#30D158]"></i>
                      <span class="hidden sm:inline">Concluir</span>
                    </button>

                    <a
                      href="${this.getMapsUrl(nextStep.activity.query || (nextStep.activity.title + ' ' + trip.city))}"
                      target="_blank"
                      rel="noopener noreferrer"
                      class="flex-1 sm:flex-initial inline-flex items-center justify-center gap-2 px-5 py-3 rounded-2xl bg-[#0A84FF] hover:bg-[#0A84FF]/90 text-white text-xs sm:text-sm font-bold shadow-lg shadow-[#0A84FF]/30 transition"
                    >
                      <i data-lucide="navigation" class="w-4 h-4"></i>
                      <span>Navegar no Maps</span>
                    </a>
                  </div>
                ` : `
                  <div class="flex items-center justify-between w-full gap-4 flex-wrap">
                    <div class="flex items-center gap-3">
                      <div class="w-10 h-10 rounded-2xl bg-[#30D158]/20 text-[#30D158] flex items-center justify-center">
                        <i data-lucide="Sparkles" class="w-5 h-5"></i>
                      </div>
                      <div>
                        <div class="text-xs font-semibold uppercase tracking-wider text-[#30D158]">Roteiro 100% Concluído</div>
                        <div class="text-sm font-semibold text-white">Todas as atividades programadas foram visitadas!</div>
                      </div>
                    </div>
                    <button onclick="app.setTab('itinerary'); app.openActivityModal('${trip.id}', ${Math.min(this.state.selectedDayIndex, Math.max(0, (trip.days?.length || 1) - 1))})" class="px-4 py-2.5 rounded-full bg-white/10 hover:bg-white/15 text-xs font-semibold text-white">
                      + Nova Parada Extra
                    </button>
                  </div>
                `}
              </div>

              <!-- Mini Conversor Rápido no Topo (Exibido automaticamente fora da Zona do Euro, ex: Budapeste / HUF) -->
              ${isNonEuro ? `
                <div class="rounded-3xl apple-card p-5 flex flex-col justify-between gap-3">
                  <div class="flex items-center justify-between">
                    <span class="text-[11px] font-semibold uppercase tracking-wider text-[#FF9F0A] flex items-center gap-1.5">
                      <i data-lucide="arrow-left-right" class="w-3.5 h-3.5"></i>
                      Câmbio Rápido (${this.escape(trip.localCurrency)})
                    </span>
                    <span class="text-[10px] font-mono text-zinc-400">Instantâneo</span>
                  </div>

                  <div class="flex items-center gap-2">
                    <input
                      type="number"
                      step="any"
                      value="${this.state.converterAmount}"
                      oninput="app.updateQuickConverter(this.value, '${trip.localCurrency}')"
                      class="w-full rounded-xl bg-black/60 border border-white/10 px-3 py-2 font-mono text-sm font-bold text-white focus:border-[#FF9F0A] focus:outline-none"
                    />
                    <span class="px-2.5 py-2 rounded-xl bg-[#FF9F0A]/15 text-[#FF9F0A] font-mono text-xs font-bold">${this.escape(trip.localCurrency)}</span>
                  </div>

                  <div class="grid grid-cols-2 gap-2 text-xs font-mono">
                    <div class="px-3 py-1.5 rounded-xl bg-black/45 border border-white/5 flex items-center justify-between">
                      <span class="text-zinc-400">EUR</span>
                      <span class="js-conv-eur font-semibold text-white">${this.formatEUR(this.toEUR(this.state.converterAmount, trip.localCurrency))}</span>
                    </div>
                    <div class="px-3 py-1.5 rounded-xl bg-black/45 border border-white/5 flex items-center justify-between">
                      <span class="text-zinc-400">BRL</span>
                      <span class="js-conv-brl font-semibold text-[#30D158]">${this.formatBRL(this.toBRL(this.state.converterAmount, trip.localCurrency))}</span>
                    </div>
                  </div>
                </div>
              ` : ''}
            </section>

            <!-- Barra de 5 Abas Estilo Pílulas Apple -->
            <nav class="flex items-center gap-2 overflow-x-auto no-scrollbar py-1">
              ${navTabs.map(tab => {
                const active = this.state.activeTab === tab.id;
                return `
                  <button onclick="app.setTab('${tab.id}')" class="shrink-0 inline-flex items-center gap-2 px-4 py-2.5 rounded-full text-xs sm:text-sm font-semibold border transition ${
                    active
                      ? 'bg-white text-black border-white shadow'
                      : 'bg-[#1C1C1E] text-zinc-400 border-white/10 hover:text-white hover:bg-[#2C2C2E]'
                  }">
                    <i data-lucide="${tab.icon}" class="w-4 h-4"></i>
                    <span>${tab.label}</span>
                  </button>
                `;
              }).join('')}
            </nav>

            <!-- Conteúdo da Aba Selecionada -->
            <div>
              ${this.state.activeTab === 'itinerary' ? this.renderTabItinerary(trip) : ''}
              ${this.state.activeTab === 'logistics' ? this.renderTabLogistics(trip) : ''}
              ${this.state.activeTab === 'gastronomy' ? this.renderTabGastronomy(trip) : ''}
              ${this.state.activeTab === 'budget' ? this.renderTabBudget(trip) : ''}
              ${this.state.activeTab === 'checklist' ? this.renderTabChecklistAndGuide(trip) : ''}
            </div>
          </div>
        `;
      },

      // -------------------------------------------------------------------------
      // ABA 1: ROTEIRO DIA A DIA
      // -------------------------------------------------------------------------
      renderTabItinerary(trip) {
        const days = trip.days || [];
        const dayIdx = Math.min(this.state.selectedDayIndex, Math.max(0, days.length - 1));
        const currentDay = days[dayIdx];

        return `
          <div class="space-y-6 animate-apple">
            <!-- Seletor Horizontal de Dias -->
            <div class="flex items-center justify-between gap-3 flex-wrap">
              <div class="flex items-center gap-2 overflow-x-auto no-scrollbar py-1">
                ${days.map((d, idx) => {
                  const active = idx === dayIdx;
                  return `
                    <button onclick="app.setDayIndex(${idx})" class="shrink-0 px-4 py-2 rounded-full text-xs font-semibold border transition ${
                      active
                        ? 'bg-[#0A84FF] text-white border-[#0A84FF] shadow-md shadow-[#0A84FF]/25'
                        : 'bg-[#1C1C1E] text-zinc-300 border-white/10 hover:bg-[#2C2C2E]'
                    }">
                      Dia ${d.dayNumber}
                    </button>
                  `;
                }).join('')}
                <button onclick="app.addDayToTrip('${trip.id}')" class="shrink-0 px-3.5 py-2 rounded-full text-xs font-semibold bg-[#1C1C1E] hover:bg-[#2C2C2E] text-[#64D2FF] border border-dashed border-white/20 transition">
                  + Dia
                </button>
              </div>

              ${currentDay ? `
                <button onclick="app.openActivityModal('${trip.id}', ${dayIdx})" class="inline-flex items-center gap-1.5 px-4 py-2 rounded-full text-xs font-semibold bg-white hover:bg-zinc-200 text-black transition">
                  <i data-lucide="plus" class="w-3.5 h-3.5 stroke-[2.5]"></i>
                  <span>Adicionar Atividade</span>
                </button>
              ` : ''}
            </div>

            ${!currentDay ? `
              <div class="p-10 rounded-3xl apple-card text-center text-sm text-zinc-400">Nenhum dia cadastrado ainda.</div>
            ` : `
              <!-- Cabeçalho Técnico do Dia -->
              <div class="rounded-3xl apple-card p-5 sm:p-6">
                <div class="flex items-start justify-between gap-4">
                  <div>
                    <span class="text-[11px] font-semibold uppercase tracking-widest text-[#64D2FF]">Dia ${currentDay.dayNumber} • Curadoria Tática</span>
                    <h2 class="text-xl sm:text-2xl font-bold text-white mt-1 tracking-tight">${this.escape(currentDay.title)}</h2>
                  </div>
                  <div class="flex items-center gap-1.5">
                    <button onclick="app.openEditDayHeaderModal('${trip.id}', ${dayIdx})" title="Editar ou excluir este dia" class="px-3 py-1.5 rounded-full bg-white/[0.07] hover:bg-white/[0.14] text-xs font-medium text-zinc-200 border border-white/10 flex items-center gap-1.5">
                      <i data-lucide="pencil" class="w-3.5 h-3.5"></i>
                      <span class="hidden sm:inline">Editar Dia</span>
                    </button>
                  </div>
                </div>

                <div class="mt-4 grid grid-cols-1 md:grid-cols-2 gap-3 text-xs">
                  <div class="flex items-start gap-3 p-3.5 rounded-2xl bg-black/45 border border-white/[0.07]">
                    <i data-lucide="thermometer-sun" class="w-4 h-4 text-[#64D2FF] shrink-0 mt-0.5"></i>
                    <div>
                      <span class="font-semibold text-zinc-200 block">Clima & Dress Code</span>
                      <span class="text-zinc-400">${this.escape(currentDay.weatherDress)}</span>
                    </div>
                  </div>
                  <div class="flex items-start gap-3 p-3.5 rounded-2xl bg-black/45 border border-white/[0.07]">
                    <i data-lucide="route" class="w-4 h-4 text-[#30D158] shrink-0 mt-0.5"></i>
                    <div>
                      <span class="font-semibold text-zinc-200 block">Logística de Abertura</span>
                      <span class="text-zinc-400">${this.escape(currentDay.openingLogistics)}</span>
                    </div>
                  </div>
                </div>
              </div>

              <!-- Timeline de Atividades -->
              ${currentDay.activities.length === 0 ? `
                <div class="rounded-3xl apple-card p-10 text-center">
                  <p class="text-sm text-zinc-400 mb-4">Nenhuma atividade cadastrada neste dia.</p>
                  <button onclick="app.openActivityModal('${trip.id}', ${dayIdx})" class="px-5 py-2.5 rounded-full text-xs font-semibold bg-[#0A84FF] text-white">+ Adicionar Primeira Atividade</button>
                </div>
              ` : `
                <div class="relative pl-4 sm:pl-6 border-l border-white/15 space-y-4">
                  ${currentDay.activities.map(act => {
                    const expanded = !!this.state.expandedActivities[act.id];
                    return `
                      <div class="relative rounded-3xl apple-card transition ${
                        act.done ? 'opacity-80 border-[#30D158]/35' : 'hover:border-white/20'
                      }">
                        <span class="absolute -left-[22px] sm:-left-[30px] top-6 w-3.5 h-3.5 rounded-full border-2 border-black ${act.done ? 'bg-[#30D158]' : 'bg-[#0A84FF]'}"></span>

                        <div onclick="app.toggleActivityExpand('${act.id}')" class="cursor-pointer p-4 sm:p-5 flex items-start sm:items-center justify-between gap-3">
                          <div class="flex items-start sm:items-center gap-3.5 min-w-0">
                            <button
                              type="button"
                              onclick="app.toggleActivityDone('${trip.id}', ${dayIdx}, '${act.id}', event)"
                              class="mt-0.5 sm:mt-0 w-6 h-6 rounded-full border flex items-center justify-center shrink-0 transition ${
                                act.done
                                  ? 'bg-[#30D158] border-[#30D158] text-black'
                                  : 'bg-black/60 border-zinc-500 hover:border-[#0A84FF]'
                              }"
                            >
                              ${act.done ? '<i data-lucide="check" class="w-3.5 h-3.5 stroke-[3]"></i>' : ''}
                            </button>

                            <span class="px-2.5 py-1 rounded-xl bg-black/60 border border-white/10 font-mono text-xs font-semibold text-[#64D2FF] shrink-0">
                              ${this.escape(act.time)}
                            </span>

                            <div class="min-w-0">
                              <h3 class="text-sm sm:text-base font-semibold ${act.done ? 'line-through text-zinc-400' : 'text-white'}">${this.escape(act.title)}</h3>
                              <p class="text-xs text-zinc-400 truncate mt-0.5">${this.escape(act.neighborhood)}</p>
                            </div>
                          </div>

                          <div class="flex items-center gap-2.5 shrink-0">
                            <span class="hidden sm:inline-block px-3 py-1 rounded-full bg-white/[0.07] text-xs font-mono text-zinc-200">${this.escape(act.cost)}</span>
                            <i data-lucide="${expanded ? 'chevron-up' : 'chevron-down'}" class="w-4 h-4 text-zinc-400"></i>
                          </div>
                        </div>

                        ${expanded ? `
                          <div class="px-4 sm:px-5 pb-5 pt-2 border-t border-white/10 space-y-4 animate-apple">
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-3.5 text-xs leading-relaxed">
                              <div class="p-4 rounded-2xl bg-black/50 border border-white/[0.07]">
                                <div class="flex items-center gap-1.5 font-semibold text-zinc-200 mb-1.5">
                                  <i data-lucide="book-open" class="w-3.5 h-3.5 text-[#64D2FF]"></i>
                                  <span>Contexto Histórico & Arquitetônico</span>
                                </div>
                                <p class="text-zinc-400">${this.escape(act.history)}</p>
                              </div>

                              <div class="p-4 rounded-2xl bg-black/50 border border-white/[0.07]">
                                <div class="flex items-center gap-1.5 font-semibold text-zinc-200 mb-1.5">
                                  <i data-lucide="eye" class="w-3.5 h-3.5 text-[#30D158]"></i>
                                  <span>Olhar de Curador (O que observar)</span>
                                </div>
                                <p class="text-zinc-400">${this.escape(act.curatorEye)}</p>
                              </div>
                            </div>

                            <div class="p-4 rounded-2xl bg-[#FF9F0A]/10 border border-[#FF9F0A]/25 text-xs leading-relaxed">
                              <div class="flex items-center gap-1.5 font-semibold text-[#FF9F0A] mb-1">
                                <i data-lucide="sparkles" class="w-3.5 h-3.5"></i>
                                <span>Segredo Local (Easter Egg)</span>
                              </div>
                              <p class="text-zinc-200">${this.escape(act.secret)}</p>
                            </div>

                            <div class="flex flex-wrap items-center justify-between gap-2 pt-1">
                              <a
                                href="${this.getMapsUrl(act.query || (act.title + ' ' + trip.city))}"
                                target="_blank"
                                rel="noopener noreferrer"
                                class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-[#0A84FF] hover:bg-[#0A84FF]/90 text-white text-xs font-semibold transition"
                              >
                                <i data-lucide="map-pin" class="w-3.5 h-3.5"></i>
                                <span>Abrir no Google Maps</span>
                              </a>

                              <div class="flex items-center gap-2">
                                <button
                                  type="button"
                                  onclick="app.openActivityModal('${trip.id}', ${dayIdx}, '${act.id}')"
                                  class="px-3.5 py-2 rounded-full bg-white/[0.07] hover:bg-white/[0.14] text-xs font-medium text-zinc-200 border border-white/10"
                                >
                                  Editar
                                </button>
                                <button
                                  type="button"
                                  onclick="app.deleteActivity('${trip.id}', ${dayIdx}, '${act.id}', event)"
                                  class="px-3.5 py-2 rounded-full bg-[#FF453A]/15 hover:bg-[#FF453A]/25 text-xs font-medium text-[#FF453A]"
                                >
                                  Excluir
                                </button>
                              </div>
                            </div>
                          </div>
                        ` : ''}
                      </div>
                    `;
                  }).join('')}
                </div>
              `}
            `}
          </div>
        `;
      },

      // -------------------------------------------------------------------------
      // ABA 2: LOGÍSTICA & INTELIGÊNCIA LOCAL
      // -------------------------------------------------------------------------
      renderTabLogistics(trip) {
        const l = trip.logistics || {};
        const tMode = TRANSPORT_MODES[l.mode || 'plane'] || TRANSPORT_MODES.plane;

        return `
          <div class="space-y-6 animate-apple">
            <div class="flex items-center justify-between">
              <h2 class="text-lg font-bold text-white">Cartões de Embarque & Regras Críticas</h2>
              <button onclick="app.openEditLogisticsModal('${trip.id}')" class="inline-flex items-center gap-1.5 px-4 py-2 rounded-full text-xs font-semibold bg-white/[0.08] hover:bg-white/[0.15] text-white border border-white/10">
                <i data-lucide="pencil" class="w-3.5 h-3.5"></i>
                <span>Editar Logística</span>
              </button>
            </div>

            <!-- Boarding Pass & Hospedagem -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">
              <!-- Cartão de Transporte Principal -->
              <div class="rounded-3xl apple-card overflow-hidden flex flex-col justify-between">
                <div class="p-6 space-y-4">
                  <div class="flex items-center justify-between gap-2">
                    <span class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-[#0A84FF]/15 text-[#64D2FF] text-xs font-semibold border border-[#0A84FF]/30">
                      <i data-lucide="${tMode.icon}" class="w-3.5 h-3.5"></i>
                      <span>${this.escape(tMode.short)} Principal</span>
                    </span>
                    <button
                      type="button"
                      onclick="app.copyText('${this.escape(l.pnr)}', 'Código', this)"
                      class="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-full bg-white text-black text-xs font-mono font-bold hover:bg-zinc-200 transition"
                    >
                      <i data-lucide="copy" class="w-3.5 h-3.5"></i>
                      <span>${this.escape(l.pnr || 'N/A')}</span>
                    </button>
                  </div>

                  <div>
                    <h3 class="text-lg font-bold text-white">${this.escape(l.transportType)}</h3>
                    <p class="text-xs text-zinc-300 mt-1">${this.escape(l.route)}</p>
                  </div>

                  <div class="p-3.5 rounded-2xl bg-black/50 border border-white/[0.07] text-xs space-y-1.5">
                    <div class="text-zinc-400"><strong class="text-zinc-200">Horários:</strong> ${this.escape(l.schedule)}</div>
                    <div class="text-zinc-400"><strong class="text-zinc-200">Notas:</strong> ${this.escape(l.transportNotes)}</div>
                  </div>
                </div>

                <div class="boarding-perforation h-5 border-t border-dashed border-white/15"></div>
                <div class="px-6 py-3 bg-black/40 flex items-center justify-between text-[11px] font-mono text-zinc-400">
                  <span>LOCALIZADOR / PASSE</span>
                  <span class="text-white font-bold">${this.escape(l.pnr || '—')}</span>
                </div>
              </div>

              <!-- Cartão de Hospedagem -->
              <div class="rounded-3xl apple-card p-6 flex flex-col justify-between gap-4">
                <div class="space-y-4">
                  <div class="flex items-center justify-between">
                    <span class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-[#30D158]/15 text-[#30D158] text-xs font-semibold border border-[#30D158]/30">
                      <i data-lucide="bed-double" class="w-3.5 h-3.5"></i>
                      <span>Hospedagem Base</span>
                    </span>
                    <a
                      href="${this.getMapsUrl((l.hotelName || '') + ' ' + (l.hotelAddress || trip.city))}"
                      target="_blank"
                      rel="noopener noreferrer"
                      class="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-full bg-[#0A84FF] hover:bg-[#0A84FF]/90 text-white text-xs font-semibold transition"
                    >
                      <i data-lucide="navigation" class="w-3.5 h-3.5"></i>
                      <span>Abrir no Maps</span>
                    </a>
                  </div>

                  <div>
                    <h3 class="text-lg font-bold text-white">${this.escape(l.hotelName)}</h3>
                    <p class="text-xs text-zinc-300 mt-1">${this.escape(l.hotelAddress)}</p>
                  </div>
                </div>

                <div class="p-3.5 rounded-2xl bg-black/50 border border-white/[0.07] text-xs text-zinc-300 flex items-center gap-2">
                  <i data-lucide="clock" class="w-4 h-4 text-[#FF9F0A] shrink-0"></i>
                  <span>${this.escape(l.checkInOut)}</span>
                </div>
              </div>
            </div>

            <!-- 3 Cards de Inteligência de Campo -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-xs leading-relaxed">
              <div class="rounded-3xl apple-card p-5 space-y-2 border-l-4 border-l-[#FF453A]">
                <div class="flex items-center gap-2 font-bold text-white text-sm">
                  <i data-lucide="shield-alert" class="w-4 h-4 text-[#FF453A]"></i>
                  <span>Bilhetagem & Regras Críticas</span>
                </div>
                <p class="text-zinc-300">${this.escape(l.ticketingRules)}</p>
              </div>

              <div class="rounded-3xl apple-card p-5 space-y-2 border-l-4 border-l-[#0A84FF]">
                <div class="flex items-center gap-2 font-bold text-white text-sm">
                  <i data-lucide="graduation-cap" class="w-4 h-4 text-[#64D2FF]"></i>
                  <span>Descontos Sub-26 / Estudante</span>
                </div>
                <p class="text-zinc-300">${this.escape(l.studentDiscounts)}</p>
              </div>

              <div class="rounded-3xl apple-card p-5 space-y-2 border-l-4 border-l-[#30D158]">
                <div class="flex items-center gap-2 font-bold text-white text-sm">
                  <i data-lucide="languages" class="w-4 h-4 text-[#30D158]"></i>
                  <span>Moeda & Sobrevivência Local</span>
                </div>
                <p class="text-zinc-300">${this.escape(l.currencyVocab)}</p>
              </div>
            </div>
          </div>
        `;
      },

      // -------------------------------------------------------------------------
      // ABA 3: CURADORIA GASTRONÔMICA
      // -------------------------------------------------------------------------
      renderTabGastronomy(trip) {
        const q = (this.state.gastronomySearch || '').toLowerCase();
        const items = (trip.gastronomy || []).filter(g => {
          if (!q) return true;
          return `${g.name} ${g.neighborhood} ${g.mustTry} ${g.notes}`.toLowerCase().includes(q);
        });

        return `
          <div class="space-y-6 animate-apple">
            <!-- Formulário Rápido de Descoberta Gastronômica -->
            <form onsubmit="app.handleAddGastronomy(event, '${trip.id}')" class="rounded-3xl apple-card p-5 space-y-3 text-xs">
              <div class="flex items-center justify-between">
                <span class="font-semibold text-white text-sm">Salvar Restaurante, Café ou Bar</span>
                <span class="text-zinc-400">Zero armadilhas de turista</span>
              </div>
              <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-2.5">
                <input name="name" required placeholder="Nome do lugar *" class="rounded-xl bg-black/60 border border-white/10 px-3 py-2 text-white" />
                <input name="neighborhood" placeholder="Bairro" class="rounded-xl bg-black/60 border border-white/10 px-3 py-2 text-white" />
                <input name="mustTry" required placeholder="Prato/Bebida Obrigatória *" class="rounded-xl bg-black/60 border border-white/10 px-3 py-2 text-white" />
                <div class="grid grid-cols-2 gap-2">
                  <input name="dayRef" placeholder="Ex: Dia 2" class="rounded-xl bg-black/60 border border-white/10 px-3 py-2 text-white" />
                  <select name="priceRange" class="rounded-xl bg-black/60 border border-white/10 px-2.5 py-2 text-white font-mono">
                    <option value="€">€</option>
                    <option value="€€" selected>€€</option>
                    <option value="€€€">€€€</option>
                  </select>
                </div>
                <button type="submit" class="rounded-xl bg-white hover:bg-zinc-200 text-black font-semibold py-2 px-4 transition">+ Salvar Lugar</button>
              </div>
              <input name="notes" placeholder="Dica extra (ex: chegar antes das 19h, pagar em espécie)..." class="w-full rounded-xl bg-black/60 border border-white/10 px-3 py-2 text-white" />
            </form>

            <!-- Busca na Lista -->
            <div class="flex items-center justify-between gap-3">
              <h3 class="text-base font-bold text-white">${items.length} Endereço(s) Curado(s)</h3>
              <input
                type="text"
                value="${this.escape(this.state.gastronomySearch)}"
                oninput="app.state.gastronomySearch = this.value; app.render();"
                placeholder="Filtrar prato ou bairro..."
                class="w-56 px-3.5 py-2 rounded-full bg-[#1C1C1E] border border-white/10 text-xs text-white focus:outline-none"
              />
            </div>

            <!-- Grid de Restaurantes -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              ${items.map(g => `
                <div class="rounded-3xl apple-card p-5 flex flex-col justify-between gap-4">
                  <div class="space-y-3">
                    <div class="flex items-start justify-between gap-2">
                      <div>
                        <span class="text-[11px] font-medium text-[#64D2FF]">${this.escape(g.dayRef)} • ${this.escape(g.neighborhood)}</span>
                        <h4 class="text-base font-bold text-white mt-0.5">${this.escape(g.name)}</h4>
                      </div>
                      <span class="px-2.5 py-1 rounded-full bg-white/10 font-mono text-xs font-semibold text-[#30D158]">${this.escape(g.priceRange)}</span>
                    </div>

                    <div class="p-3 rounded-2xl bg-[#FF9F0A]/10 border border-[#FF9F0A]/25 text-xs">
                      <span class="text-[10px] font-bold uppercase tracking-wider text-[#FF9F0A] block mb-0.5">Pedido Obrigatório</span>
                      <span class="text-white font-medium">${this.escape(g.mustTry)}</span>
                    </div>

                    <p class="text-xs text-zinc-400 leading-relaxed">${this.escape(g.notes)}</p>
                  </div>

                  <div class="pt-3 border-t border-white/10 flex items-center justify-between">
                    <a
                      href="${this.getMapsUrl(g.query || (g.name + ' ' + trip.city))}"
                      target="_blank"
                      rel="noopener noreferrer"
                      class="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-full bg-[#0A84FF] hover:bg-[#0A84FF]/90 text-white text-xs font-semibold transition"
                    >
                      <i data-lucide="map-pin" class="w-3.5 h-3.5"></i>
                      <span>Ver no Maps</span>
                    </a>

                    <button onclick="app.deleteGastronomy('${trip.id}', '${g.id}')" class="text-xs text-zinc-500 hover:text-[#FF453A] px-2 py-1">
                      Remover
                    </button>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      },

      // -------------------------------------------------------------------------
      // ABA 4: ORÇAMENTO MULTI-MOEDA & CONVERSOR
      // -------------------------------------------------------------------------
      renderTabBudget(trip) {
        const b = trip.budgetEstimated || { transport: 0, attractions: 0, food: 0 };
        const estTotal = this.getTripEstimatedTotal(trip);
        const realTotalEUR = this.getTripRealTotalEUR(trip);
        const diff = estTotal - realTotalEUR;
        const pctUsed = estTotal > 0 ? Math.min(100, Math.round((realTotalEUR / estTotal) * 100)) : 0;

        return `
          <div class="space-y-6 animate-apple">
            <!-- Resumo Financeiro + Conversor Universal -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-5">
              <div class="lg:col-span-2 rounded-3xl apple-card p-6 space-y-5">
                <div class="flex items-center justify-between">
                  <h3 class="text-base font-bold text-white">Orçamento Estimado vs. Gasto Real</h3>
                  <button onclick="app.openEditContingencyModal('${trip.id}')" class="text-xs text-[#64D2FF] hover:underline">Editar Metas</button>
                </div>

                <div class="grid grid-cols-3 gap-3 text-xs">
                  <div class="p-4 rounded-2xl bg-black/50 border border-white/[0.07]">
                    <span class="text-zinc-400 block">Estimado</span>
                    <span class="text-lg sm:text-xl font-mono font-bold text-white mt-1 block">${this.formatEUR(estTotal)}</span>
                  </div>
                  <div class="p-4 rounded-2xl bg-black/50 border border-white/[0.07]">
                    <span class="text-zinc-400 block">Gasto Real</span>
                    <span class="text-lg sm:text-xl font-mono font-bold text-[#64D2FF] mt-1 block">${this.formatEUR(realTotalEUR)}</span>
                  </div>
                  <div class="p-4 rounded-2xl bg-black/50 border border-white/[0.07]">
                    <span class="text-zinc-400 block">Saldo</span>
                    <span class="text-lg sm:text-xl font-mono font-bold ${diff >= 0 ? 'text-[#30D158]' : 'text-[#FF453A]'} mt-1 block">${this.formatEUR(diff)}</span>
                  </div>
                </div>

                <div>
                  <div class="flex justify-between text-xs mb-1.5">
                    <span class="text-zinc-400">Execução do Orçamento</span>
                    <span class="font-mono text-white">${pctUsed}%</span>
                  </div>
                  <div class="w-full h-2.5 rounded-full bg-white/10 overflow-hidden">
                    <div class="h-full rounded-full ${pctUsed > 100 ? 'bg-[#FF453A]' : 'bg-gradient-to-r from-[#0A84FF] to-[#30D158]'}" style="width: ${pctUsed}%"></div>
                  </div>
                </div>

                <div class="grid grid-cols-3 gap-2 text-[11px] text-zinc-400 pt-1">
                  <div>🚆 Transporte: <strong class="text-white font-mono">${this.formatEUR(b.transport)}</strong></div>
                  <div>🏛️ Atrações: <strong class="text-white font-mono">${this.formatEUR(b.attractions)}</strong></div>
                  <div>🍽️ Comida: <strong class="text-white font-mono">${this.formatEUR(b.food)}</strong></div>
                </div>
              </div>

              <!-- Calculadora Multi-Moeda -->
              <div class="rounded-3xl apple-card p-6 flex flex-col justify-between gap-4">
                <div>
                  <span class="text-[11px] font-semibold uppercase tracking-wider text-[#FF9F0A]">Conversor Multi-Moeda</span>
                  <h3 class="text-base font-bold text-white mt-0.5">Câmbio Rápido de Bolso</h3>
                </div>

                <div class="flex gap-2">
                  <input
                    type="number"
                    step="any"
                    value="${this.state.converterAmount}"
                    oninput="app.updateQuickConverter(this.value, null)"
                    class="w-full rounded-xl bg-black/60 border border-white/10 px-3 py-2.5 font-mono text-sm font-bold text-white"
                  />
                  <select
                    onchange="app.updateQuickConverter(null, this.value)"
                    class="rounded-xl bg-[#2C2C2E] border border-white/10 px-3 py-2.5 font-mono text-xs font-bold text-white"
                  >
                    ${Object.keys(EXCHANGE_RATES_TO_EUR).map(c => `<option value="${c}" ${this.state.converterFrom === c ? 'selected' : ''}>${c}</option>`).join('')}
                  </select>
                </div>

                <div class="space-y-2 font-mono text-xs">
                  <div class="p-3 rounded-2xl bg-black/50 flex justify-between items-center">
                    <span class="text-zinc-400">Em Euro (EUR)</span>
                    <span class="js-conv-eur text-sm font-bold text-white">${this.formatEUR(this.toEUR(this.state.converterAmount, this.state.converterFrom))}</span>
                  </div>
                  <div class="p-3 rounded-2xl bg-black/50 flex justify-between items-center">
                    <span class="text-zinc-400">Em Real (BRL)</span>
                    <span class="js-conv-brl text-sm font-bold text-[#30D158]">${this.formatBRL(this.toBRL(this.state.converterAmount, this.state.converterFrom))}</span>
                  </div>
                </div>
              </div>
            </div>

            <!-- Lançamento Rápido de Despesa -->
            <form onsubmit="app.addExpense(event, '${trip.id}')" class="rounded-3xl apple-card p-5 space-y-3 text-xs">
              <div class="font-bold text-white text-sm">Registrar Gasto na Rua</div>
              <div class="grid grid-cols-1 sm:grid-cols-5 gap-2.5">
                <input name="title" required placeholder="Descrição (ex: Jantar, Metrô) *" class="sm:col-span-2 rounded-xl bg-black/60 border border-white/10 px-3 py-2.5 text-white" />
                <select name="category" class="rounded-xl bg-black/60 border border-white/10 px-3 py-2.5 text-white">
                  <option value="Alimentação">Alimentação</option>
                  <option value="Transporte">Transporte</option>
                  <option value="Atrações">Atrações</option>
                  <option value="Hospedagem">Hospedagem</option>
                  <option value="Extras">Extras</option>
                </select>
                <div class="flex gap-1.5">
                  <input name="amount" type="number" step="0.01" required placeholder="Valor *" class="w-full rounded-xl bg-black/60 border border-white/10 px-3 py-2.5 font-mono text-white" />
                  <select name="currency" class="rounded-xl bg-black/60 border border-white/10 px-2 py-2.5 font-mono text-white">
                    ${Object.keys(EXCHANGE_RATES_TO_EUR).map(c => `<option value="${c}" ${(trip.localCurrency || 'EUR') === c ? 'selected' : ''}>${c}</option>`).join('')}
                  </select>
                </div>
                <button type="submit" class="rounded-xl bg-[#30D158] hover:bg-[#30D158]/90 text-black font-bold py-2.5 px-4 transition">+ Lançar</button>
              </div>
            </form>

            <!-- Lista de Despesas Lançadas -->
            <div class="rounded-3xl apple-card p-5 space-y-3">
              <h4 class="text-sm font-bold text-white">Extrato da Viagem (${(trip.expenses || []).length})</h4>
              ${(trip.expenses || []).length === 0 ? `
                <p class="text-xs text-zinc-400">Nenhuma despesa lançada ainda.</p>
              ` : `
                <div class="divide-y divide-white/10">
                  ${trip.expenses.map(exp => `
                    <div class="py-3 flex items-center justify-between gap-3 text-xs">
                      <div>
                        <div class="font-semibold text-white">${this.escape(exp.title)}</div>
                        <div class="text-[11px] text-zinc-400">${this.escape(exp.category)}</div>
                      </div>
                      <div class="flex items-center gap-3">
                        <div class="text-right font-mono">
                          <div class="font-bold text-white">${this.formatOriginalCurrency(exp.amount, exp.currency)}</div>
                          ${exp.currency !== 'EUR' ? `<div class="text-[10px] text-zinc-400">≈ ${this.formatEUR(this.toEUR(exp.amount, exp.currency))}</div>` : ''}
                        </div>
                        <button onclick="app.deleteExpense('${trip.id}', '${exp.id}')" class="text-zinc-500 hover:text-[#FF453A] p-1">
                          <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                        </button>
                      </div>
                    </div>
                  `).join('')}
                </div>
              `}
            </div>
          </div>
        `;
      },

      // -------------------------------------------------------------------------
      // ABA 5: CHECKLIST DE PREPARAÇÃO, PLANO B & VOCABULÁRIO
      // -------------------------------------------------------------------------
      renderTabChecklistAndGuide(trip) {
        const list = trip.prepChecklist || [];
        const c = trip.contingency || { planB: '', souvenirs: '' };

        return `
          <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 animate-apple">
            <!-- Checklist Interativo -->
            <div class="lg:col-span-2 rounded-3xl apple-card p-6 space-y-5">
              <div>
                <h3 class="text-base font-bold text-white">Checklist Pré-Embarque & Mala</h3>
                <p class="text-xs text-zinc-400 mt-0.5">Toque para marcar o que já está separado na mochila</p>
              </div>

              <form onsubmit="app.addPrepItem(event, '${trip.id}')" class="flex flex-col sm:flex-row gap-2 text-xs">
                <select name="category" class="rounded-xl bg-black/60 border border-white/10 px-3 py-2.5 text-zinc-200">
                  <option value="Documentos/ID">Documentos/ID</option>
                  <option value="Cartões/Dinheiro">Cartões/Dinheiro</option>
                  <option value="Passes de Transporte">Passes de Transporte</option>
                  <option value="Eletrônicos">Eletrônicos</option>
                  <option value="Clima/Roupas">Clima/Roupas</option>
                </select>
                <input name="text" required placeholder="Adicionar item ao checklist..." class="flex-1 rounded-xl bg-black/60 border border-white/10 px-3 py-2.5 text-white" />
                <button type="submit" class="px-4 py-2.5 rounded-xl bg-white text-black font-semibold">+ Item</button>
              </form>

              <div class="space-y-2">
                ${list.map(item => `
                  <div onclick="app.togglePrepItem('${trip.id}', '${item.id}')" class="cursor-pointer p-3.5 rounded-2xl bg-black/45 hover:bg-black/65 border border-white/[0.07] flex items-center justify-between gap-3 transition">
                    <div class="flex items-center gap-3 min-w-0">
                      <span class="w-5 h-5 rounded-full border flex items-center justify-center shrink-0 ${
                        item.done ? 'bg-[#30D158] border-[#30D158] text-black' : 'border-zinc-500'
                      }">
                        ${item.done ? '<i data-lucide="check" class="w-3 h-3 stroke-[3]"></i>' : ''}
                      </span>
                      <div class="min-w-0">
                        <span class="text-[10px] font-semibold uppercase tracking-wider text-[#64D2FF] block">${this.escape(item.category)}</span>
                        <span class="text-xs ${item.done ? 'line-through text-zinc-500' : 'text-zinc-100'}">${this.escape(item.text)}</span>
                      </div>
                    </div>
                    <button type="button" onclick="event.stopPropagation(); app.deletePrepItem('${trip.id}', '${item.id}')" class="text-zinc-500 hover:text-[#FF453A] p-1">
                      <i data-lucide="x" class="w-3.5 h-3.5"></i>
                    </button>
                  </div>
                `).join('')}
              </div>
            </div>

            <!-- Plano B & Souvenirs -->
            <div class="space-y-4 text-xs leading-relaxed">
              <div class="rounded-3xl apple-card p-5 space-y-2">
                <div class="flex items-center justify-between">
                  <span class="font-bold text-white text-sm flex items-center gap-1.5">
                    <i data-lucide="cloud-rain" class="w-4 h-4 text-[#64D2FF]"></i>
                    Plano B (Chuva / Imprevistos)
                  </span>
                  <button onclick="app.openEditContingencyModal('${trip.id}')" class="text-[#64D2FF] hover:underline">Editar</button>
                </div>
                <p class="text-zinc-300">${this.escape(c.planB)}</p>
              </div>

              <div class="rounded-3xl apple-card p-5 space-y-2">
                <span class="font-bold text-white text-sm flex items-center gap-1.5">
                  <i data-lucide="gift" class="w-4 h-4 text-[#FF9F0A]"></i>
                  Souvenirs & Achados Locais
                </span>
                <p class="text-zinc-300">${this.escape(c.souvenirs)}</p>
              </div>

              <div class="rounded-3xl apple-card p-5 space-y-2">
                <span class="font-bold text-white text-sm flex items-center gap-1.5">
                  <i data-lucide="message-circle" class="w-4 h-4 text-[#30D158]"></i>
                  Vocabulário & Pagamentos
                </span>
                <p class="text-zinc-300">${this.escape(trip.logistics?.currencyVocab || '')}</p>
              </div>
            </div>
          </div>
        `;
      }
    };

    window.addEventListener('DOMContentLoaded', () => app.init());
// Registra Manifest PWA e Ícone SVG embutido para instalação nativa no celular
    (function setupPWA() {
      const svgIcon = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="112" fill="#0A84FF"/><circle cx="256" cy="256" r="150" fill="none" stroke="#ffffff" stroke-width="28"/><polygon points="256,145 300,256 256,367 212,256" fill="#ffffff"/><circle cx="256" cy="256" r="18" fill="#0A84FF"/></svg>`;
      const iconUrl = 'data:image/svg+xml;base64,' + btoa(svgIcon);

      const manifest = {
        name: 'Atlas Concierge — Travel Hub',
        short_name: 'Atlas',
        start_url: './',
        display: 'standalone',
        background_color: '#000000',
        theme_color: '#000000',
        icons: [
          { src: iconUrl, sizes: '192x192', type: 'image/svg+xml', purpose: 'any maskable' },
          { src: iconUrl, sizes: '512x512', type: 'image/svg+xml', purpose: 'any maskable' }
        ]
      };

      const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
      const manifestEl = document.getElementById('pwa-manifest');
      if (manifestEl) manifestEl.href = URL.createObjectURL(manifestBlob);

      if ('serviceWorker' in navigator) {
        const swCode = `self.addEventListener('fetch', function(e) {});`;
        const swBlob = new Blob([swCode], { type: 'application/javascript' });
        navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(() => {});
      }
    })();
  </script>
</body>
</html>
